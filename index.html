aparkan melalui Slice tersebut."},{type:"subheading",text:"C. Contoh Slice: ApprovedBookings"},{type:"p",text:"Tujuan: Memaparkan tempahan yang telah diluluskan."},{type:"code",title:"Row Filter Condition (ApprovedBookings)",code:'[Status] = "Approved"'},{type:"subheading",text:"D. Komponen dalam Slice"},{type:"label",text:"Antara tetapan yang boleh dikawal:"},{type:"ol",items:["Slice Name – nama Slice.","Source Table – jadual sumber.","Row Filter Condition – syarat pemilihan rekod.","Slice Columns – Column yang mahu disertakan.","Slice Actions – tindakan yang dibenarkan melalui Slice."]},{type:"callout",variant:"important",title:"Penting",text:"Slice bukan pengganti Security Filter. Slice mengawal data yang dipaparkan dalam bahagian aplikasi, tetapi bukan mekanisme keselamatan untuk memastikan rekod yang tidak dibenarkan tidak dimuat turun ke peranti pengguna. Gunakan Security Filter dan kawalan keselamatan yang sesuai untuk perlindungan data."}]},{id:"5.7",title:"5.7 Memahami Views",blocks:[{type:"p",text:"Views ialah paparan yang digunakan untuk menunjukkan data kepada pengguna."},{type:"p",text:"Satu Table boleh mempunyai beberapa Views yang berbeza."},{type:"label",text:"Contohnya, Table BOOKINGS boleh mempunyai:"},{type:"ul",items:["Paparan semua tempahan.","Paparan tempahan saya.","Paparan tempahan menunggu kelulusan.","Paparan kalendar tempahan."]},{type:"subheading",text:"A. Jenis-jenis Views"},{type:"label",text:"1. Table View"},{type:"p",text:"Memaparkan data dalam bentuk jadual dan baris. Sesuai untuk: Senarai rekod, Senarai tempahan, Senarai pengguna, Senarai inventori."},{type:"label",text:"2. Deck View"},{type:"p",text:"Memaparkan rekod dalam bentuk kad. Sesuai untuk: Senarai bilik, Senarai produk, Senarai pelanggan, Senarai tempahan."},{type:"label",text:"3. Gallery View"},{type:"p",text:"Memaparkan rekod dalam bentuk galeri, biasanya dengan imej sebagai elemen utama. Sesuai untuk: Katalog produk, Galeri gambar, Senarai aset yang mempunyai gambar."},{type:"label",text:"4. Detail View"},{type:"p",text:"Memaparkan maklumat lengkap bagi satu rekod. Sesuai untuk: Butiran tempahan, Maklumat pengguna, Maklumat bilik."},{type:"label",text:"5. Form View"},{type:"p",text:"Digunakan untuk memasukkan rekod baharu atau mengemaskini rekod sedia ada. Sesuai untuk: Borang tempahan, Borang pendaftaran, Borang permohonan."},{type:"label",text:"6. Chart View"},{type:"p",text:"Memaparkan data dalam bentuk carta. Sesuai untuk: Statistik tempahan, Jumlah jualan, Analisis prestasi."},{type:"label",text:"7. Dashboard View"},{type:"p",text:"Menggabungkan beberapa Views dalam satu paparan. Contohnya, Dashboard Sistem Tempahan Bilik boleh mengandungi: Senarai tempahan terkini, Carta jumlah tempahan, Senarai tempahan menunggu kelulusan."},{type:"label",text:"8. Calendar View"},{type:"p",text:"Memaparkan rekod berdasarkan tarikh. Sesuai untuk: Jadual penggunaan bilik, Jadual mesyuarat, Jadual aktiviti."},{type:"label",text:"9. Map View"},{type:"p",text:"Memaparkan rekod yang mempunyai maklumat lokasi pada peta. Sesuai untuk: Lokasi pelanggan, Lokasi aset, Lokasi projek."},{type:"p",text:"Ketersediaan dan pilihan paparan tertentu boleh bergantung pada struktur data serta konfigurasi aplikasi."},{type:"subheading",text:"B. Komponen Tetapan Views"},{type:"p",text:"Apabila membina View, beberapa tetapan penting perlu difahami."},{type:"ul",items:["View Name – Nama paparan yang akan digunakan dalam aplikasi. Contoh: Senarai Tempahan, Tempahan Saya, Senarai Bilik, Kelulusan Tempahan.","For This Data – Menentukan Table atau Slice yang menjadi sumber data View. Contoh: BOOKINGS, ROOMS, MyBookings, PendingBookings.","View Type – Menentukan bentuk paparan seperti Table, Deck, Form, Detail dan sebagainya.","Position – Menentukan kedudukan View dalam navigasi aplikasi: Primary Navigation (paparan utama yang mudah dicapai), Menu Navigation (paparan yang diletakkan dalam menu), Ref (paparan apabila pengguna membuka rekod atau navigasi berkaitan). Pilihan sebenar mungkin berbeza mengikut versi Editor.","Display Name – Nama yang dipaparkan kepada pengguna. Contoh: Nama View: MyBookings → Display Name: Tempahan Saya.","Icon – Ikon yang digunakan untuk mewakili sesuatu View. Contoh: Tempahan (ikon kalendar), Pengguna (ikon pengguna), Bilik (ikon bangunan), Laporan (ikon carta)."]}]},{id:"5.8",title:"5.8 Menguruskan Navigation",blocks:[{type:"p",text:"Navigation ialah sistem pergerakan pengguna dari satu paparan ke paparan yang lain."},{type:"p",text:"Navigasi yang baik memudahkan pengguna mencari fungsi yang diperlukan."},{type:"label",text:"Contoh susunan menu bagi Sistem Tempahan Bilik:"},{type:"ol",items:["Dashboard","Tempahan Saya","Senarai Bilik","Buat Tempahan","Kelulusan","Laporan"]},{type:"label",text:"Cadangan susunan mengikut peranan:"},{type:"subheading",text:"Pengguna biasa"},{type:"ul",items:["Dashboard.","Tempahan Saya.","Senarai Bilik.","Buat Tempahan."]},{type:"subheading",text:"Pegawai pelulus"},{type:"ul",items:["Dashboard.","Tempahan Menunggu Kelulusan.","Sejarah Kelulusan."]},{type:"subheading",text:"Pentadbir"},{type:"ul",items:["Dashboard.","Pengurusan Pengguna.","Pengurusan Bilik.","Semua Tempahan.","Laporan."]},{type:"callout",variant:"note",title:"Nota",text:"Susunan paparan sahaja tidak mencukupi untuk mengawal akses. Tetapan keselamatan dan kebenaran pengguna perlu dikonfigurasikan secara berasingan."}]},{id:"5.9",title:"5.9 Memahami Format Rules",blocks:[{type:"p",text:"Format Rules digunakan untuk mengubah penampilan sesuatu rekod berdasarkan syarat yang ditetapkan."},{type:"table",title:"Contohnya, dalam sistem tempahan bilik:",headers:["Status","Paparan"],rows:[["Pending","Kuning"],["Approved","Hijau"],["Rejected","Merah"]]},{type:"label",text:"Contoh langkah membina Format Rule:"},{type:"ol",items:["Buka AppSheet Editor.","Pergi ke bahagian App atau kawasan pengurusan Format Rules mengikut versi Editor.","Tambah Format Rule baharu.","Masukkan nama peraturan.","Pilih Table yang berkaitan.","Tetapkan syarat.","Pilih ikon atau gaya paparan.","Simpan perubahan."]},{type:"code",title:"Contoh syarat Format Rule",code:'[Status] = "Approved"'},{type:"p",text:"Apabila syarat dipenuhi, AppSheet akan menggunakan format yang telah ditetapkan. Format Rules membantu pengguna mengenal pasti status rekod dengan lebih cepat."}]},{id:"5.10",title:"5.10 Aktiviti Amali: Menguruskan Editor Sistem Tempahan Bilik",blocks:[{type:"p",text:"Dalam aktiviti ini, peserta akan menggunakan aplikasi FBMS yang dibina dalam Modul 4."},{type:"subheading",text:"Tugasan 1: Semak Table"},{type:"p",text:"Pastikan aplikasi mempunyai Table berikut:"},{type:"ul",items:["USERS","ROOMS","BOOKINGS","APPROVALS"]},{type:"subheading",text:"Tugasan 2: Semak Column"},{type:"p",text:"Buka setiap Table dan semak: Nama Column, Type, Key, Label, Required?, Editable?. Pastikan tetapan setiap Column sesuai dengan fungsi sistem."},{type:"subheading",text:"Tugasan 3: Bina Slice MyBookings"},{type:"ol",items:["Pergi ke Data.","Pilih Slices.","Tambah Slice.","Namakan MyBookings.","Pilih Source Table: BOOKINGS.","Masukkan formula: [UserEmail] = USEREMAIL()","Simpan perubahan."]},{type:"subheading",text:"Tugasan 4: Bina Slice PendingBookings"},{type:"ol",items:["Tambah Slice baharu.","Namakan PendingBookings.","Pilih Source Table: BOOKINGS.",'Masukkan formula: [Status] = "Pending"',"Simpan perubahan."]},{type:"subheading",text:"Tugasan 5: Bina Views"},{type:"table",title:"Bina paparan berikut:",headers:["View Name","Data Source","View Type"],rows:[["Senarai Bilik","ROOMS","Deck"],["Semua Tempahan","BOOKINGS","Table"],["Tempahan Saya","MyBookings","Table"],["Tempahan Baharu","BOOKINGS","Form"],["Kelulusan","PendingBookings","Table"]]},{type:"subheading",text:"Tugasan 6: Bina Format Rules"},{type:"ul",items:["Status Pending: warna kuning.","Status Approved: warna hijau.","Status Rejected: warna merah."]},{type:"subheading",text:"Tugasan 7: Uji Aplikasi"},{type:"ol",items:["Buka Preview aplikasi.","Semak setiap View.","Cuba tambah tempahan baharu.","Semak sama ada tempahan muncul dalam senarai yang betul.","Uji Slice Tempahan Saya menggunakan akaun pengguna yang sesuai.","Uji paparan Tempahan Menunggu Kelulusan.","Pastikan paparan mudah difahami."]}]},{id:"5.11",title:"5.11 Latihan Pengukuhan",blocks:[{type:"quiz_mcq",questions:[{number:1,q:"Apakah fungsi utama Data dalam AppSheet Editor?",options:[{key:"A",text:"Mengubah warna aplikasi sahaja"},{key:"B",text:"Menguruskan sumber data dan struktur jadual"},{key:"C",text:"Menghantar e-mel secara automatik"},{key:"D",text:"Membina logo aplikasi"}],answer:"B",explanation:"Bahagian Data dalam AppSheet Editor digunakan untuk menguruskan Tables, Columns, Slices dan struktur maklumat aplikasi."},{number:2,q:"Apakah kegunaan Key dalam sesuatu Table?",options:[{key:"A",text:"Menentukan warna rekod"},{key:"B",text:"Mengenal pasti rekod secara unik"},{key:"C",text:"Menentukan susunan menu"},{key:"D",text:"Menyimpan gambar"}],answer:"B",explanation:"Key ialah nilai unik yang digunakan untuk mengenal pasti setiap rekod secara unik dalam sesuatu jadual."},{number:3,q:"Apakah fungsi Slice?",options:[{key:"A",text:"Menghapuskan semua data"},{key:"B",text:"Menghasilkan sebahagian paparan data berdasarkan syarat"},{key:"C",text:"Mengubah sumber data kepada PDF"},{key:"D",text:"Menghantar notifikasi"}],answer:"B",explanation:"Slice menapis dan menyediakan sebahagian paparan terpilih daripada Table asal berdasarkan Row Filter Condition."},{number:4,q:"View yang sesuai untuk memaparkan rekod dalam bentuk kalendar ialah:",options:[{key:"A",text:"Table"},{key:"B",text:"Deck"},{key:"C",text:"Calendar"},{key:"D",text:"Gallery"}],answer:"C",explanation:"Calendar View memaparkan rekod mengikut tarikh seperti jadual penggunaan bilik, mesyuarat dan aktiviti."},{number:5,q:"Apakah perbezaan utama Initial Value dengan App Formula?",options:[{key:"A",text:"Kedua-duanya mempunyai fungsi yang sama"},{key:"B",text:"Initial Value menetapkan nilai awal, manakala App Formula mengira nilai menggunakan formula"},{key:"C",text:"Initial Value hanya untuk gambar"},{key:"D",text:"App Formula hanya untuk nama pengguna"}],answer:"B",explanation:"Initial Value menetapkan nilai permulaan semasa rekod dicipta (boleh diedit jika dibenarkan), manakala App Formula mengira nilai secara automatik berdasarkan data lain."},{number:6,q:"Apakah fungsi Format Rules?",options:[{key:"A",text:"Mengubah penampilan rekod berdasarkan syarat"},{key:"B",text:"Menghapuskan rekod lama"},{key:"C",text:"Menambah Table baharu"},{key:"D",text:"Membina akaun pengguna"}],answer:"A",explanation:"Format Rules mengubah penampilan visual (warna, ikon, gaya teks) sesuatu rekod apabila syarat tertentu dipenuhi."}]}]},{id:"5.12",title:"5.12 Ringkasan Modul",blocks:[{type:"p",text:"Dalam modul ini, peserta telah mempelajari komponen utama AppSheet Editor, termasuk:"},{type:"ol",items:["Data – menguruskan sumber data.","Tables – menguruskan jadual.","Columns – menetapkan struktur dan sifat medan.","Slices – menghasilkan paparan data berdasarkan syarat.","Views – menentukan bentuk paparan aplikasi.","Navigation – mengawal susunan paparan.","Format Rules – memberikan penampilan berasaskan syarat."]},{type:"p",text:"Kesemua komponen ini penting untuk menghasilkan aplikasi yang tersusun, berfungsi dengan baik dan mudah digunakan."}]},{id:"5.13",title:"5.13 Hasil Pembelajaran Modul & Persediaan ke Modul 6",blocks:[{type:"p",text:"Peserta dianggap menguasai modul ini apabila berjaya:"},{type:"ul",items:["Mengenal pasti komponen utama AppSheet Editor.","Menguruskan Table dan Column.","Memahami Key dan Label.","Membina sekurang-kurangnya dua Slice.","Membina sekurang-kurangnya tiga Views.","Menyusun navigasi aplikasi.","Menghasilkan Format Rules berdasarkan status rekod."]},{type:"callout",variant:"tip",title:"Persediaan ke Modul 6",text:"Modul seterusnya akan memberi tumpuan kepada penggunaan AppSheet Expressions. Peserta akan belajar menggunakan formula seperti IF(), IFS(), AND(), OR(), SELECT(), FILTER(), LOOKUP(), ANY(), COUNT() dan fungsi lain untuk membina logik aplikasi yang lebih pintar."}]}]},sg={id:6,code:"MODUL 6",title:"Menguasai AppSheet Expressions dan Formula",shortTitle:"Expressions & Formula",subtitle:"Operator perbandingan, matematik & logik, fungsi asas, IF/IFS, SELECT, FILTER, LOOKUP, ANY, fungsi pengiraan, dereference dan 6 kesilapan lazim.",pages:"Muka surat 64 – 80",duration:"90 minit",level:"Intermediate",sections:[{id:"6.1",title:"6.1 Pengenalan",blocks:[{type:"p",text:"AppSheet Expressions ialah formula atau arahan logik yang digunakan untuk mengawal bagaimana aplikasi berfungsi."},{type:"label",text:"Expressions membolehkan pembangun:"},{type:"ul",items:["Membuat pengiraan secara automatik.","Menentukan syarat tertentu.","Menapis rekod berdasarkan kriteria.","Mendapatkan maklumat daripada Table lain.","Mengawal paparan sesuatu medan.","Menentukan sama ada sesuatu tindakan dibenarkan.","Menghasilkan nilai secara automatik."]},{type:"label",text:"Contohnya, dalam Sistem Tempahan Bilik (FBMS), kita boleh menggunakan Expressions untuk:"},{type:"ol",items:["Mengisi e-mel pengguna secara automatik.","Menentukan status awal tempahan.","Memastikan tarikh tempahan tidak berlaku pada tarikh yang telah berlalu.","Memaparkan hanya tempahan milik pengguna yang sedang log masuk.","Mengira jumlah tempahan.","Mengawal proses kelulusan."]}]},{id:"6.2",title:"6.2 Objektif Pembelajaran",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Memahami konsep AppSheet Expressions.","Mengenal pasti fungsi asas Expressions.","Menggunakan operator perbandingan dan logik.","Membina formula menggunakan IF dan IFS.","Menggunakan fungsi SELECT, FILTER dan LOOKUP.","Menggunakan fungsi pengiraan.","Mengawal paparan dan kemasukan data.","Menghasilkan formula berdasarkan situasi sebenar."]}]},{id:"6.3",title:"6.3 Di Mana Expressions Digunakan?",blocks:[{type:"p",text:"Expressions boleh digunakan dalam beberapa tetapan AppSheet."},{type:"table",title:"Lokasi & Kegunaan Expressions",headers:["Komponen","Kegunaan"],rows:[["Initial Value","Menetapkan nilai awal"],["App Formula","Mengira nilai secara automatik"],["Valid If","Menentukan nilai yang dibenarkan"],["Show If","Mengawal paparan medan atau komponen"],["Editable If","Mengawal kebolehan mengedit"],["Required If","Menentukan medan wajib diisi"],["Row Filter Condition","Menapis rekod dalam Slice"],["Only If This Condition Is True","Mengawal sama ada sesuatu Action boleh dijalankan"],["Format Rules","Menentukan keadaan untuk format paparan"]]},{type:"code",title:"Contoh",code:"USEREMAIL()"},{type:"p",text:"Formula ini mendapatkan alamat e-mel pengguna yang sedang log masuk."}]},{id:"6.4",title:"6.4 Memahami Operator Asas",blocks:[{type:"p",text:"Operator digunakan untuk membandingkan nilai atau membina pengiraan."},{type:"subheading",text:"A. Operator Perbandingan"},{type:"table",headers:["Operator","Maksud","Contoh"],rows:[["=","Sama dengan",'[Status] = "Approved"'],["<>","Tidak sama dengan",'[Status] <> "Rejected"'],[">","Lebih besar","[Age] > 18"],["<","Lebih kecil","[Quantity] < 100"],[">=","Lebih besar atau sama","[Score] >= 50"],["<=","Lebih kecil atau sama","[Price] <= 100"]]},{type:"subheading",text:"B. Operator Matematik"},{type:"table",headers:["Operator","Fungsi","Contoh"],rows:[["+","Tambah","[A] + [B]"],["-","Tolak","[A] - [B]"],["*","Darab","[Quantity] * [Price]"],["/","Bahagi","[Total] / [Quantity]"]]},{type:"subheading",text:"C. Operator Logik"},{type:"table",headers:["Operator","Fungsi"],rows:[["AND","Semua syarat mesti benar"],["OR","Sekurang-kurangnya satu syarat benar"],["NOT","Menukar benar kepada palsu atau sebaliknya"]]},{type:"code",title:"Contoh AND (Kedua-dua syarat mesti dipenuhi)",code:`AND(
  [Status] = "Pending",
  [RoomID] = "R001"
)`},{type:"code",title:"Contoh OR (Salah satu syarat perlu dipenuhi)",code:`OR(
  [Status] = "Approved",
  [Status] = "Pending"
)`},{type:"code",title:"Contoh NOT (Benar apabila Status bukan Rejected)",code:'NOT([Status] = "Rejected")'}]},{id:"6.5",title:"6.5 Fungsi Asas yang Wajib Dikuasai",blocks:[{type:"subheading",text:"A. USEREMAIL()"},{type:"p",text:"Mendapatkan e-mel pengguna yang sedang log masuk."},{type:"code",code:"USEREMAIL()"},{type:"label",text:"Kegunaan:"},{type:"ul",items:["Mengisi e-mel pemohon secara automatik.","Menapis rekod mengikut pengguna.","Menentukan akses berdasarkan identiti pengguna."]},{type:"p",text:"Contoh penggunaan dalam Initial Value: USEREMAIL() — Apabila pengguna membuat tempahan, sistem akan mengisi e-melnya secara automatik."},{type:"subheading",text:"B. TODAY()"},{type:"p",text:"Mendapatkan tarikh semasa."},{type:"code",title:"Contoh penggunaan",code:"[BookingDate] >= TODAY()"},{type:"p",text:"Formula ini memastikan tarikh tempahan tidak lebih awal daripada tarikh hari ini."},{type:"subheading",text:"C. NOW()"},{type:"p",text:"Mendapatkan tarikh dan masa semasa. Boleh digunakan untuk merekodkan masa sesuatu rekod diwujudkan."},{type:"code",code:"NOW()"},{type:"subheading",text:"D. UNIQUEID()"},{type:"p",text:"Menghasilkan nilai unik untuk mengenal pasti rekod. Sesuai digunakan dalam Initial Value bagi Column Key."},{type:"code",code:"UNIQUEID()"},{type:"subheading",text:"E. ISBLANK()"},{type:"p",text:"Memeriksa sama ada sesuatu nilai kosong."},{type:"code",title:"Menghasilkan TRUE jika Purpose kosong",code:"ISBLANK([Purpose])"},{type:"code",title:"Contoh lain — Memastikan UserEmail telah diisi",code:"NOT(ISBLANK([UserEmail]))"},{type:"subheading",text:"F. IN()"},{type:"p",text:"Memeriksa sama ada sesuatu nilai wujud dalam senarai."},{type:"code",title:"Menghasilkan TRUE jika Status ialah Pending atau Approved",code:'IN([Status], {"Pending", "Approved"})'},{type:"subheading",text:"G. CONTAINS()"},{type:"p",text:"Memeriksa sama ada teks tertentu terkandung dalam teks lain."},{type:"code",title:"Memeriksa sama ada RoomName mengandungi perkataan Makmal",code:'CONTAINS([RoomName], "Makmal")'},{type:"subheading",text:"H. TEXT()"},{type:"p",text:"Menukarkan nilai kepada bentuk teks. Berguna apabila nilai tarikh atau nombor perlu dipaparkan sebagai teks."},{type:"code",code:"TEXT([BookingDate])"}]},{id:"6.6",title:"6.6 Fungsi IF dan IFS",blocks:[{type:"p",text:"Fungsi IF digunakan untuk membuat keputusan berdasarkan sesuatu syarat."},{type:"code",title:"Struktur IF",code:"IF(condition, value_if_true, value_if_false)"},{type:"code",title:"Contoh IF (Markah Lulus / Gagal)",code:`IF(
  [Score] >= 50,
  "Lulus",
  "Gagal"
)`},{type:"ul",items:["Jika markah 50 atau lebih, paparkan Lulus.","Jika kurang daripada 50, paparkan Gagal."]},{type:"subheading",text:"Contoh dalam Sistem Tempahan Bilik"},{type:"p",text:"Katakan kita mahu menentukan status permohonan berdasarkan nilai kelulusan."},{type:"code",code:`IF(
  [ApprovalStatus] = "Approved",
  "Tempahan Diluluskan",
  "Menunggu Kelulusan"
)`},{type:"subheading",text:"Fungsi IFS"},{type:"p",text:"IFS digunakan apabila terdapat beberapa syarat."},{type:"code",title:"Struktur IFS",code:`IFS(
  condition1, result1,
  condition2, result2,
  condition3, result3
)`},{type:"code",title:"Contoh IFS (Gred Markah)",code:`IFS(
  [Score] >= 80, "Cemerlang",
  [Score] >= 65, "Baik",
  [Score] >= 50, "Lulus",
  TRUE, "Gagal"
)`},{type:"label",text:"Maksud:"},{type:"ul",items:["80 dan ke atas: Cemerlang.","65 hingga 79: Baik.","50 hingga 64: Lulus.","Selain itu: Gagal."]},{type:"callout",variant:"warning",title:"Perhatian",text:"Susunan syarat dalam IFS penting. AppSheet akan menggunakan hasil bagi syarat pertama yang benar."}]},{id:"6.7",title:"6.7 Fungsi SELECT()",blocks:[{type:"p",text:"SELECT digunakan untuk mendapatkan senarai nilai daripada sesuatu Table berdasarkan syarat tertentu."},{type:"code",title:"Struktur SELECT()",code:"SELECT(TableName[ColumnName], condition)"},{type:"code",title:"Contoh 1: Mendapatkan nama bilik yang mempunyai Availability bernilai Available",code:`SELECT(
  ROOMS[RoomName],
  [Availability] = "Available"
)`},{type:"code",title:"Contoh 2: Mendapatkan Senarai Tempahan Pengguna",code:`SELECT(
  BOOKINGS[BookingID],
  [UserEmail] = USEREMAIL()
)`},{type:"p",text:"Formula ini mendapatkan senarai BookingID milik pengguna yang sedang log masuk."},{type:"code",title:"Contoh 3: Mendapatkan Tempahan Pending",code:`SELECT(
  BOOKINGS[BookingID],
  [Status] = "Pending"
)`},{type:"p",text:"Formula ini mendapatkan senarai ID tempahan yang masih menunggu kelulusan."},{type:"callout",variant:"important",title:"Nota penting",text:"Dalam SELECT, syarat biasanya dinilai berdasarkan setiap rekod dalam Table yang dirujuk. Oleh itu, rujukan Column dalam syarat perlu difahami berdasarkan konteks Table tersebut."}]},{id:"6.8",title:"6.8 Fungsi FILTER()",blocks:[{type:"p",text:"FILTER digunakan untuk mendapatkan senarai Key bagi rekod yang memenuhi sesuatu syarat."},{type:"code",title:"Struktur FILTER()",code:'FILTER("TableName", condition)'},{type:"code",title:"Contoh FILTER()",code:`FILTER(
  "BOOKINGS",
  [Status] = "Pending"
)`},{type:"p",text:"Formula ini menghasilkan senarai Key rekod dalam BOOKINGS yang mempunyai Status Pending."},{type:"table",title:"Perbezaan asas SELECT vs FILTER:",headers:["SELECT","FILTER"],rows:[["Mendapatkan nilai daripada Column tertentu","Mendapatkan senarai Key rekod"],["Rujuk Table dan Column","Rujuk nama Table"],["Boleh mendapatkan senarai e-mel, ID atau nilai lain","Berguna untuk mendapatkan rekod yang memenuhi syarat"]]}]},{id:"6.9",title:"6.9 Fungsi LOOKUP()",blocks:[{type:"p",text:"LOOKUP digunakan untuk mendapatkan satu nilai daripada Table lain berdasarkan nilai carian."},{type:"code",title:"Struktur LOOKUP()",code:`LOOKUP(
  search_value,
  "TableName",
  "SearchColumn",
  "ReturnColumn"
)`},{type:"code",title:"Contoh LOOKUP()",code:`LOOKUP(
  [RoomID],
  "ROOMS",
  "RoomID",
  "RoomName"
)`},{type:"label",text:"Maksud:"},{type:"ol",items:["Ambil nilai RoomID daripada rekod semasa.","Cari nilai tersebut dalam Column RoomID di Table ROOMS.","Pulangkan nilai RoomName daripada rekod yang sepadan."]},{type:"table",title:"Contohnya:",headers:["RoomID","RoomName"],rows:[["R001","Bilik Mesyuarat A"],["R002","Makmal Komputer 1"]]},{type:"p",text:"Jika RoomID ialah R001, formula akan memulangkan Bilik Mesyuarat A."}]},{id:"6.10",title:"6.10 Fungsi ANY()",blocks:[{type:"p",text:"ANY digunakan untuk mendapatkan satu nilai daripada senarai atau hasil senarai."},{type:"code",title:"Contoh ANY()",code:`ANY(
  SELECT(
    USERS[FullName],
    [Email] = USEREMAIL()
  )
)`},{type:"p",text:"Formula ini mendapatkan satu nama pengguna yang sepadan dengan e-mel pengguna yang sedang log masuk."},{type:"callout",variant:"warning",title:"Perhatian",text:"Pastikan syarat carian menghasilkan rekod yang unik jika anda menjangkakan satu nilai tertentu. Jika terdapat banyak rekod yang sepadan, ANY tidak semestinya memilih rekod berdasarkan susunan yang anda jangkakan."}]},{id:"6.11",title:"6.11 Fungsi COUNT(), SUM() dan AVERAGE()",blocks:[{type:"p",text:"Fungsi ini digunakan untuk pengiraan data."},{type:"subheading",text:"A. COUNT()"},{type:"p",text:"Mengira bilangan item dalam senarai."},{type:"code",title:"Formula ini mengira jumlah tempahan yang masih Pending",code:`COUNT(
  SELECT(
    BOOKINGS[BookingID],
    [Status] = "Pending"
  )
)`},{type:"subheading",text:"B. SUM()"},{type:"p",text:"Menjumlahkan semua nilai dalam senarai."},{type:"code",title:"Formula ini menjumlahkan semua transaksi yang telah dibayar",code:`SUM(
  SELECT(
    SALES[TotalAmount],
    [PaymentStatus] = "Paid"
  )
)`},{type:"subheading",text:"C. AVERAGE()"},{type:"p",text:"Mengira nilai purata."},{type:"code",title:"Formula ini mengira purata markah pelajar dalam kelas DIT1",code:`AVERAGE(
  SELECT(
    STUDENTS[Score],
    [Class] = "DIT1"
  )
)`},{type:"subheading",text:"D. MAX() dan MIN()"},{type:"p",text:"MAX mendapatkan nilai paling tinggi. MIN mendapatkan nilai paling rendah."},{type:"code",title:"Contoh MAX() dan MIN()",code:`MAX(BOOKINGS[BookingDate])
MIN(BOOKINGS[BookingDate])`},{type:"p",text:"Kegunaan bergantung pada jenis data dan konteks pengiraan."}]},{id:"6.12",title:"6.12 Fungsi TEXT(), CONCATENATE() dan TODAY()",blocks:[{type:"subheading",text:"A. CONCATENATE()"},{type:"p",text:"Menggabungkan beberapa teks."},{type:"code",title:"Contoh CONCATENATE()",code:`CONCATENATE(
  "Nama Pemohon: ",
  [FullName],
  " - ",
  [Status]
)`},{type:"p",text:"Contoh hasil: Nama Pemohon: Ali - Pending"},{type:"subheading",text:"B. TEXT()"},{type:"p",text:"Menukarkan nilai kepada teks."},{type:"code",code:"TEXT([BookingDate])"},{type:"subheading",text:"C. YEAR(), MONTH() dan DAY()"},{type:"p",text:"Mendapatkan komponen tarikh."},{type:"code",code:`YEAR([BookingDate])
MONTH([BookingDate])
DAY([BookingDate])`},{type:"label",text:"Contoh: Jika BookingDate ialah 20/11/2026:"},{type:"ul",items:["YEAR menghasilkan 2026.","MONTH menghasilkan 11.","DAY menghasilkan 20."]}]},{id:"6.13",title:"6.13 Mengawal Paparan Menggunakan Expressions",blocks:[{type:"p",text:"Expressions boleh digunakan untuk menentukan sama ada sesuatu medan atau komponen perlu dipaparkan."},{type:"subheading",text:"A. Show If"},{type:"code",code:'[Status] = "Rejected"'},{type:"p",text:"Jika digunakan pada medan Catatan Penolakan, medan tersebut hanya dipaparkan apabila Status ialah Rejected."},{type:"subheading",text:"B. Editable If"},{type:"code",code:'[Status] = "Pending"'},{type:"p",text:"Medan hanya boleh diedit apabila status masih Pending."},{type:"subheading",text:"C. Required If"},{type:"code",code:'[Status] = "Rejected"'},{type:"p",text:"Catatan penolakan diwajibkan apabila status permohonan ialah Rejected."},{type:"subheading",text:"D. Valid If"},{type:"code",code:"[BookingDate] >= TODAY()"},{type:"p",text:"Pengguna hanya boleh memilih tarikh hari ini atau tarikh akan datang."},{type:"callout",variant:"important",title:"Peringatan",text:"Show If, Editable If dan Required If membantu mengawal pengalaman pengguna, tetapi bukan pengganti kawalan keselamatan data."}]},{id:"6.14",title:"6.14 Contoh Projek: Membina Logik Sistem Tempahan Bilik",blocks:[{type:"p",text:"Dalam bahagian ini, peserta akan membina beberapa Expressions untuk FBMS."},{type:"subheading",text:"Tugasan 1: Jana BookingID Secara Automatik"},{type:"p",text:"Table: BOOKINGS | Column: BookingID | Type: Text | Key: ON | Initial Value:"},{type:"code",code:"UNIQUEID()"},{type:"subheading",text:"Tugasan 2: Isi E-mel Pemohon Secara Automatik"},{type:"p",text:"Column: UserEmail | Initial Value:"},{type:"code",code:"USEREMAIL()"},{type:"p",text:"Cadangan: Tetapkan medan ini supaya pengguna tidak boleh mengubah e-mel pemohon secara bebas jika proses sistem memerlukannya."},{type:"subheading",text:"Tugasan 3: Tetapkan Tarikh Tempahan"},{type:"p",text:"Column: BookingDate | Initial Value:"},{type:"code",code:"TODAY()"},{type:"subheading",text:"Tugasan 4: Pastikan Tarikh Tidak Berlaku Pada Masa Lalu"},{type:"p",text:"Column: BookingDate | Valid If:"},{type:"code",code:"[_THIS] >= TODAY()"},{type:"subheading",text:"Tugasan 5: Tetapkan Status Awal"},{type:"p",text:"Column: Status | Initial Value:"},{type:"code",code:'"Pending"'},{type:"subheading",text:"Tugasan 6: Paparkan Catatan Penolakan"},{type:"p",text:"Column: RejectionReason | Show If & Required If:"},{type:"code",code:'[Status] = "Rejected"'},{type:"subheading",text:"Tugasan 7: Kira Jumlah Tempahan Pending"},{type:"code",title:"Gunakan formula (dalam Virtual Column atau komponen statistik)",code:`COUNT(
  SELECT(
    BOOKINGS[BookingID],
    [Status] = "Pending"
  )
)`},{type:"subheading",text:"Tugasan 8: Paparkan Nama Bilik"},{type:"p",text:"Jika rekod BOOKINGS menyimpan RoomID yang merujuk kepada ROOMS:"},{type:"code",title:"Dereference Formula",code:"[RoomID].[RoomName]"},{type:"p",text:"Formula ini menggunakan dereference untuk mendapatkan RoomName daripada rekod ROOMS yang dirujuk oleh RoomID. Pastikan Column RoomID telah ditetapkan sebagai Ref kepada Table ROOMS."}]},{id:"6.15",title:"6.15 Kesilapan Lazim Ketika Menggunakan Expressions",blocks:[{type:"subheading",text:"Kesilapan 1: Nama Column Tidak Tepat"},{type:"code",title:"Contoh salah (nama sebenar ialah UserEmail)",code:"[User Email] = USEREMAIL()"},{type:"label",text:"Penyelesaian:"},{type:"ul",items:["Semak nama Column.","Gunakan nama yang tepat.","Pilih Column melalui Expression Assistant jika tersedia."]},{type:"subheading",text:"Kesilapan 2: Tidak Menggunakan Tanda Petikan"},{type:"code",title:"Salah vs Betul",code:`// Salah:
[Status] = Pending

// Betul:
[Status] = "Pending"`},{type:"p",text:"Teks perlu diletakkan dalam tanda petikan."},{type:"subheading",text:"Kesilapan 3: Jenis Data Tidak Sesuai"},{type:"p",text:"Contohnya, membandingkan nilai Date dengan teks biasa boleh menghasilkan ralat atau keputusan yang tidak dijangka."},{type:"ul",items:["Pastikan Type Column betul.","Gunakan fungsi penukaran yang sesuai apabila diperlukan."]},{type:"subheading",text:"Kesilapan 4: Kurungan Tidak Lengkap"},{type:"code",title:"Contoh Salah vs Betul",code:`// Salah (tiada kurungan penutup):
IF(
  [Score] >= 50,
  "Lulus",
  "Gagal"

// Betul:
IF(
  [Score] >= 50,
  "Lulus",
  "Gagal"
)`},{type:"subheading",text:"Kesilapan 5: Formula Menghasilkan Senarai Sedangkan Satu Nilai Diperlukan"},{type:"p",text:"Contohnya, SELECT boleh menghasilkan senarai nilai. Jika tetapan memerlukan satu nilai sahaja, pertimbangkan penggunaan ANY atau fungsi lain yang sesuai."},{type:"subheading",text:"Kesilapan 6: Formula Tidak Mengikut Konteks Table"},{type:"p",text:"Formula yang digunakan dalam BOOKINGS mungkin tidak boleh terus digunakan dalam ROOMS tanpa menyesuaikan rujukan Column. Sentiasa semak Table dan konteks formula."}]},{id:"6.16",title:"6.16 Latihan Pengukuhan",blocks:[{type:"quiz_mcq",questions:[{number:1,q:"Apakah fungsi USEREMAIL()?",options:[{key:"A",text:"Mendapatkan tarikh semasa"},{key:"B",text:"Mendapatkan e-mel pengguna yang sedang log masuk"},{key:"C",text:"Menjana ID unik"},{key:"D",text:"Mengira jumlah rekod"}],answer:"B",explanation:"USEREMAIL() memulangkan alamat e-mel pengguna yang sedang log masuk ke aplikasi."},{number:2,q:"Apakah fungsi UNIQUEID()?",options:[{key:"A",text:"Menjana ID unik"},{key:"B",text:"Mengira purata"},{key:"C",text:"Menapis rekod"},{key:"D",text:"Menggabungkan teks"}],answer:"A",explanation:"UNIQUEID() menjana nilai teks pengecam unik secara automatik untuk Column Key."},{number:3,q:"Formula manakah yang sesuai untuk memeriksa sama ada Status ialah Approved?",options:[{key:"A",text:'STATUS("Approved")'},{key:"B",text:'[Status] = "Approved"'},{key:"C",text:"APPROVED([Status])"},{key:"D",text:"CHECK([Status])"}],answer:"B",explanation:'Nama Column diletakkan dalam kurungan siku [Status] dan teks dibandingkan menggunakan operator = serta tanda petikan "Approved".'},{number:4,q:"Apakah fungsi SELECT()?",options:[{key:"A",text:"Memadamkan Table"},{key:"B",text:"Mendapatkan senarai nilai daripada Table berdasarkan syarat"},{key:"C",text:"Menukar warna paparan"},{key:"D",text:"Menjana ID secara automatik"}],answer:"B",explanation:"SELECT(TableName[ColumnName], condition) mendapatkan senarai nilai daripada Column tertentu dalam jadual yang memenuhi syarat."},{number:5,q:"Apakah fungsi IF()?",options:[{key:"A",text:"Membuat keputusan berdasarkan syarat"},{key:"B",text:"Mengira jumlah rekod sahaja"},{key:"C",text:"Menghubungkan dua Table"},{key:"D",text:"Membina paparan kalendar"}],answer:"A",explanation:"IF(condition, value_if_true, value_if_false) memilih nilai hasil berdasarkan sama ada syarat benar atau palsu."},{number:6,q:"Apakah fungsi COUNT()?",options:[{key:"A",text:"Menjumlahkan nilai wang"},{key:"B",text:"Mengira bilangan item dalam senarai"},{key:"C",text:"Mendapatkan nilai tertinggi"},{key:"D",text:"Menukar tarikh kepada teks"}],answer:"B",explanation:"COUNT() mengira berapa banyak elemen atau item yang terdapat dalam sesuatu senarai."},{number:7,q:"Formula manakah sesuai untuk mendapatkan tarikh semasa?",options:[{key:"A",text:"NOWDATE()"},{key:"B",text:"CURRENTDATE()"},{key:"C",text:"TODAY()"},{key:"D",text:"DATECURRENT()"}],answer:"C",explanation:"TODAY() memulangkan tarikh semasa, manakala NOW() memulangkan tarikh dan masa semasa."},{number:8,q:"Apakah fungsi LOOKUP()?",options:[{key:"A",text:"Mencari nilai berdasarkan kriteria dan memulangkan nilai daripada Column lain"},{key:"B",text:"Memadamkan rekod"},{key:"C",text:"Menukar warna aplikasi"},{key:"D",text:"Menjana nombor rawak"}],answer:"A",explanation:'LOOKUP(search_value, "TableName", "SearchColumn", "ReturnColumn") mencari nilai yang sepadan dalam jadual lain dan memulangkan nilai daripada Column sasaran.'}]}]},{id:"6.17",title:"6.17 Tugasan Amali",blocks:[{type:"p",text:"Peserta perlu melengkapkan tugasan berikut dalam aplikasi FBMS:"},{type:"ol",items:["Jana BookingID menggunakan UNIQUEID().","Isi UserEmail menggunakan USEREMAIL().","Isi BookingDate menggunakan TODAY().","Tetapkan Status awal kepada Pending.","Pastikan BookingDate tidak boleh lebih awal daripada tarikh semasa.","Paparkan RejectionReason apabila Status ialah Rejected.","Wajibkan RejectionReason apabila Status ialah Rejected.","Kira jumlah tempahan Pending menggunakan COUNT() dan SELECT().","Paparkan RoomName melalui hubungan Ref.","Uji semua formula menggunakan Preview aplikasi."]}]},{id:"6.18",title:"6.18 Ringkasan Modul",blocks:[{type:"p",text:"Dalam modul ini, peserta telah mempelajari:"},{type:"ol",items:["Konsep AppSheet Expressions.","Operator perbandingan, matematik dan logik.","Fungsi asas seperti USEREMAIL(), TODAY(), NOW() dan UNIQUEID().","Fungsi keputusan seperti IF() dan IFS().","Fungsi carian dan penapisan seperti SELECT(), FILTER() dan LOOKUP().","Fungsi senarai seperti ANY().","Fungsi pengiraan seperti COUNT(), SUM(), AVERAGE(), MAX() dan MIN().","Kawalan paparan menggunakan Show If, Editable If, Required If dan Valid If."]},{type:"p",text:"Expressions ialah asas kepada pembangunan aplikasi yang lebih pintar dan dinamik."}]},{id:"6.19",title:"6.19 Hasil Pembelajaran Modul",blocks:[{type:"p",text:"Peserta dianggap menguasai modul ini apabila berjaya:"},{type:"ul",items:["Menggunakan sekurang-kurangnya lima fungsi AppSheet.","Membina formula IF dan IFS.","Menggunakan SELECT untuk mendapatkan rekod berdasarkan syarat.","Membina formula pengiraan.","Mengawal paparan dan kemasukan data.","Menyelesaikan masalah formula asas.","Mengaplikasikan Expressions dalam Sistem Tempahan Bilik."]}]}]},lg={id:7,code:"MODUL 7",title:"Reka Bentuk Antara Muka (UI) dan Pengalaman Pengguna (UX)",shortTitle:"UI / UX & Dashboard",subtitle:"Prinsip reka bentuk aplikasi, pemilihan View, pembinaan Dashboard, Chart statistik, borang mesra pengguna, ikon & warna, Navigation, Branding & Theme dan ujian UI/UX.",pages:"Muka surat 81 – 94",duration:"60 minit",level:"Intermediate",sections:[{id:"7.1",title:"7.1 Pengenalan",blocks:[{type:"p",text:"User Interface (UI) dan User Experience (UX) merupakan dua aspek penting dalam pembangunan aplikasi."},{type:"p",text:"Aplikasi yang mempunyai fungsi lengkap tetapi sukar digunakan boleh menyebabkan pengguna kurang berminat untuk menggunakannya."},{type:"p",text:"Oleh itu, pembangun perlu memastikan aplikasi bukan sahaja berfungsi dengan baik, tetapi juga mempunyai paparan yang kemas, mudah difahami dan mesra pengguna."},{type:"subheading",text:"Apakah UI?"},{type:"p",text:"UI atau User Interface ialah reka bentuk visual yang dilihat dan digunakan oleh pengguna."},{type:"label",text:"Contoh:"},{type:"ul",items:["Butang.","Menu.","Ikon.","Warna.","Borang.","Senarai rekod.","Dashboard.","Carta dan grafik."]},{type:"subheading",text:"Apakah UX?"},{type:"p",text:"UX atau User Experience ialah pengalaman pengguna ketika menggunakan aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Mudah mencari menu.","Mudah mengisi borang.","Tidak perlu melalui terlalu banyak langkah.","Maklumat mudah difahami.","Tindakan sistem mudah dijangka.","Pengguna menerima maklum balas selepas melakukan sesuatu tindakan."]},{type:"table",title:"Perbezaan UI dan UX",headers:["UI","UX"],rows:[["Fokus kepada penampilan","Fokus kepada pengalaman penggunaan"],["Warna dan ikon","Mudah digunakan"],["Susunan butang","Aliran proses"],["Reka bentuk borang","Kemudahan mengisi borang"],["Paparan Dashboard","Kemudahan memahami maklumat"]]},{type:"callout",variant:"tip",title:"Contoh mudah",text:"Sebuah aplikasi mempunyai butang berwarna menarik dan ikon yang cantik. Ini berkaitan dengan UI. Tetapi jika pengguna perlu membuka lima menu untuk membuat satu tempahan, pengalaman penggunaan aplikasi tersebut kurang baik. Ini berkaitan dengan UX."}]},{id:"7.2",title:"7.2 Objektif Pembelajaran",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Memahami konsep UI dan UX.","Menentukan jenis View yang sesuai.","Membina Dashboard.","Menghasilkan paparan statistik.","Menyusun navigasi aplikasi.","Menggunakan ikon dan warna dengan sesuai.","Menghasilkan borang yang mesra pengguna.","Membina aplikasi yang lebih profesional."]}]},{id:"7.3",title:"7.3 Prinsip Reka Bentuk Aplikasi yang Baik",blocks:[{type:"p",text:"Terdapat beberapa prinsip yang perlu diberikan perhatian."},{type:"subheading",text:"A. Simple"},{type:"p",text:"Reka bentuk perlu ringkas dan tidak terlalu banyak elemen yang tidak diperlukan."},{type:"ul",items:["Gunakan menu yang jelas.","Elakkan terlalu banyak warna.","Paparkan maklumat penting sahaja."]},{type:"subheading",text:"B. Consistent"},{type:"p",text:"Gunakan reka bentuk yang konsisten pada keseluruhan aplikasi."},{type:"ul",items:["Nama menu menggunakan gaya yang sama.","Ikon mempunyai maksud yang jelas.","Penggunaan warna tidak berubah-ubah tanpa sebab."]},{type:"subheading",text:"C. Easy to Navigate"},{type:"p",text:"Pengguna perlu mudah bergerak antara satu paparan dengan paparan lain."},{type:"ul",items:["Menu utama mudah dikenal pasti.","Fungsi penting diletakkan pada kedudukan yang mudah dicapai.","Paparan tidak terlalu berselerak."]},{type:"subheading",text:"D. User Friendly"},{type:"p",text:"Aplikasi perlu mudah digunakan oleh pengguna yang mempunyai tahap kemahiran teknologi berbeza."},{type:"ul",items:["Label medan yang jelas.","Arahan pengisian yang ringkas.","Mesej ralat yang mudah difahami."]},{type:"subheading",text:"E. Responsive"},{type:"p",text:"Aplikasi perlu boleh digunakan melalui peranti yang berbeza seperti: Telefon pintar, Tablet, Komputer."},{type:"p",text:"Sentiasa uji aplikasi pada saiz paparan yang berbeza."}]},{id:"7.4",title:"7.4 Memilih View yang Sesuai",blocks:[{type:"p",text:"Pemilihan View mempengaruhi cara pengguna melihat dan berinteraksi dengan data."},{type:"table",title:"Jadual Pemilihan View",headers:["View","Kegunaan","Contoh"],rows:[["Table","Senarai rekod","Semua tempahan"],["Deck","Paparan berbentuk kad","Senarai bilik"],["Gallery","Paparan berasaskan imej","Galeri produk"],["Detail","Maklumat lengkap","Butiran tempahan"],["Form","Memasukkan data","Borang tempahan"],["Chart","Statistik dan analisis","Jumlah tempahan"],["Dashboard","Gabungan beberapa View","Dashboard pentadbir"],["Calendar","Paparan mengikut tarikh","Jadual tempahan"],["Map","Paparan lokasi","Lokasi aset"]]},{type:"subheading",text:"Panduan Pemilihan View"},{type:"ul",items:["Gunakan Table apabila pengguna perlu melihat banyak rekod dalam bentuk senarai.","Gunakan Deck apabila pengguna perlu melihat rekod dalam bentuk kad.","Gunakan Gallery apabila gambar menjadi maklumat utama.","Gunakan Form apabila pengguna perlu memasukkan maklumat.","Gunakan Chart apabila pengguna perlu memahami statistik.","Gunakan Dashboard apabila beberapa maklumat perlu dipaparkan dalam satu skrin."]}]},{id:"7.5",title:"7.5 Membina Dashboard",blocks:[{type:"p",text:"Dashboard ialah paparan yang menggabungkan beberapa View dalam satu ruang."},{type:"p",text:"Dashboard sangat berguna untuk aplikasi pengurusan kerana pengguna boleh melihat pelbagai maklumat penting tanpa perlu membuka banyak menu."},{type:"subheading",text:"Contoh Dashboard Sistem Tempahan Bilik"},{type:"p",text:"Dashboard FBMS boleh mengandungi:"},{type:"ol",items:["Jumlah keseluruhan tempahan.","Tempahan Pending.","Tempahan Approved.","Tempahan Rejected.","Senarai tempahan terkini.","Carta statistik tempahan."]},{type:"subheading",text:"Langkah 1: Sediakan Data Statistik"},{type:"p",text:"Pastikan Table BOOKINGS mempunyai maklumat yang diperlukan seperti: BookingID, UserEmail, RoomID, BookingDate, Status."},{type:"subheading",text:"Langkah 2: Bina Slice atau View yang Diperlukan"},{type:"p",text:"Contoh paparan: AllBookings, PendingBookings, ApprovedBookings, RejectedBookings."},{type:"code",title:"Syarat bagi setiap Slice",code:`// PendingBookings:
[Status] = "Pending"

// ApprovedBookings:
[Status] = "Approved"

// RejectedBookings:
[Status] = "Rejected"`},{type:"subheading",text:"Langkah 3: Bina View Statistik"},{type:"table",title:"Contoh View Statistik",headers:["Nama View","Sumber Data","Jenis"],rows:[["Senarai Tempahan","BOOKINGS","Table"],["Tempahan Pending","PendingBookings","Table"],["Tempahan Approved","ApprovedBookings","Table"],["Statistik Tempahan","BOOKINGS","Chart"]]},{type:"subheading",text:"Langkah 4: Bina Dashboard"},{type:"ol",items:["Buka AppSheet Editor.","Pergi ke bahagian App dan Views.","Tambah View baharu.","Berikan nama Dashboard.","Pilih jenis View Dashboard.","Pilih View yang ingin digabungkan.","Susun paparan mengikut keutamaan.","Simpan perubahan."]},{type:"p",text:"Nama dan lokasi tetapan mungkin berbeza mengikut versi AppSheet Editor."},{type:"subheading",text:"Langkah 5: Uji Dashboard"},{type:"label",text:"Semak perkara berikut:"},{type:"ul",items:["Semua komponen dipaparkan.","Tajuk setiap paparan jelas.","Carta mudah difahami.","Pengguna tidak perlu menatal terlalu banyak.","Dashboard boleh digunakan melalui telefon dan komputer."]},{type:"callout",variant:"note",title:"Nota",text:"Dashboard menggabungkan paparan sedia ada. Ia bukan semestinya menghasilkan satu rekod statistik secara automatik. Data dan formula bagi setiap komponen perlu disediakan terlebih dahulu."}]},{id:"7.6",title:"7.6 Membina Chart atau Carta Statistik",blocks:[{type:"p",text:"Chart digunakan untuk memaparkan data dalam bentuk grafik. Carta membantu pengguna memahami corak dan prestasi sesuatu sistem."},{type:"subheading",text:"Jenis Carta"},{type:"label",text:"A. Column Chart"},{type:"p",text:"Sesuai untuk membandingkan nilai antara kategori. Contoh: Jumlah tempahan mengikut bilik, Jumlah jualan mengikut bulan."},{type:"label",text:"B. Bar Chart"},{type:"p",text:"Sesuai untuk membandingkan beberapa kategori secara mendatar. Contoh: Jumlah tempahan mengikut jabatan."},{type:"label",text:"C. Pie Chart"},{type:"p",text:"Sesuai untuk menunjukkan peratusan atau bahagian daripada keseluruhan. Contoh: Peratus tempahan Pending, Peratus tempahan Approved, Peratus tempahan Rejected."},{type:"label",text:"D. Line Chart"},{type:"p",text:"Sesuai untuk melihat perubahan data mengikut masa. Contoh: Trend tempahan bulanan, Perubahan jualan sepanjang tahun."},{type:"table",title:"Contoh Data Statistik",headers:["Status","Bilangan"],rows:[["Pending","10"],["Approved","35"],["Rejected","5"]]},{type:"p",text:"Carta boleh digunakan untuk menunjukkan perbandingan jumlah tempahan mengikut status."},{type:"subheading",text:"Langkah Membina Chart"},{type:"ol",items:["Buka AppSheet Editor.","Pergi ke App dan Views.","Tambah View baharu.","Namakan View sebagai Statistik Tempahan.","Pilih Table atau Slice yang mengandungi data.","Pilih jenis View Chart.","Tetapkan Column kategori dan nilai mengikut pilihan yang tersedia.","Simpan dan uji paparan."]},{type:"callout",variant:"warning",title:"Perhatian",text:"Susunan dan jenis carta yang boleh dihasilkan bergantung pada struktur data serta pilihan Chart yang disediakan oleh AppSheet."}]},{id:"7.7",title:"7.7 Menghasilkan Borang yang Mesra Pengguna",blocks:[{type:"p",text:"Borang ialah salah satu komponen paling penting dalam kebanyakan aplikasi. Borang yang terlalu panjang atau tidak tersusun boleh menyukarkan pengguna."},{type:"subheading",text:"A. Gunakan Nama Medan yang Jelas"},{type:"ul",items:["Kurang sesuai: Col1, Data2, Field3.","Lebih sesuai: Nama Pemohon, Tarikh Tempahan, Tujuan Penggunaan, Pilihan Bilik."]},{type:"subheading",text:"B. Gunakan Description"},{type:"p",text:"Description boleh digunakan untuk memberikan arahan tambahan kepada pengguna."},{type:"code",title:"Contoh: Column Purpose → Description",code:'"Sila nyatakan tujuan penggunaan bilik dengan jelas."'},{type:"subheading",text:"C. Tetapkan Required Fields"},{type:"p",text:"Tandakan medan penting sebagai wajib diisi. Contoh: Nama Pemohon, Tarikh Tempahan, Bilik, Tujuan Tempahan."},{type:"subheading",text:"D. Susun Medan Mengikut Aliran"},{type:"label",text:"Contoh susunan borang tempahan:"},{type:"ol",items:["Maklumat Pemohon.","Maklumat Tempahan.","Tarikh dan Masa.","Tujuan Tempahan.","Pengesahan Maklumat."]},{type:"subheading",text:"E. Gunakan Input Type yang Sesuai"},{type:"ul",items:["Tarikh: Date.","Masa: Time.","E-mel: Email.","Telefon: Phone.","Tujuan: LongText.","Status: Enum."]}]},{id:"7.8",title:"7.8 Menggunakan Ikon dan Warna",blocks:[{type:"p",text:"Ikon dan warna membantu pengguna memahami fungsi dan status sesuatu maklumat."},{type:"table",title:"Cadangan Penggunaan Ikon",headers:["Fungsi","Cadangan Ikon"],rows:[["Dashboard","Home"],["Tempahan","Calendar"],["Pengguna","Person"],["Bilik","Building"],["Laporan","Chart"],["Tetapan","Settings"],["Kelulusan","Check"],["Penolakan","Cancel"]]},{type:"p",text:"Pilih ikon yang mudah difahami dan konsisten."},{type:"table",title:"Cadangan Penggunaan Warna",headers:["Warna","Penggunaan"],rows:[["Biru","Fungsi utama atau maklumat umum"],["Hijau","Berjaya atau diluluskan"],["Kuning","Menunggu tindakan"],["Merah","Ditolak atau memerlukan perhatian"],["Kelabu","Maklumat sekunder"]]},{type:"p",text:"Warna perlu digunakan secara konsisten. Jangan gunakan terlalu banyak warna dalam satu paparan."}]},{id:"7.9",title:"7.9 Membina Navigation yang Profesional",blocks:[{type:"p",text:"Navigasi menentukan bagaimana pengguna mengakses fungsi aplikasi. Contoh navigasi FBMS:"},{type:"subheading",text:"Pengguna biasa"},{type:"ol",items:["Dashboard.","Senarai Bilik.","Tempahan Saya.","Buat Tempahan."]},{type:"subheading",text:"Pegawai pelulus"},{type:"ol",items:["Dashboard.","Tempahan Menunggu Kelulusan.","Sejarah Kelulusan."]},{type:"subheading",text:"Pentadbir"},{type:"ol",items:["Dashboard.","Pengurusan Pengguna.","Pengurusan Bilik.","Semua Tempahan.","Laporan."]},{type:"callout",variant:"note",title:"Nota",text:"Susunan ini ialah cadangan reka bentuk. Untuk memastikan pengguna hanya boleh mengakses fungsi yang dibenarkan, gunakan kawalan keselamatan dan kebenaran yang sesuai."}]},{id:"7.10",title:"7.10 Menggunakan Branding dan Theme",blocks:[{type:"p",text:"Branding membantu menjadikan aplikasi mempunyai identiti tersendiri."},{type:"label",text:"Antara perkara yang boleh disesuaikan:"},{type:"ul",items:["Nama aplikasi.","Logo.","Warna utama.","Warna latar.","Ikon.","Gaya paparan."]},{type:"subheading",text:"Contoh Identiti Visual FBMS"},{type:"p",text:"Nama aplikasi: Facility Booking Management System"},{type:"label",text:"Cadangan warna:"},{type:"ul",items:["Biru gelap sebagai warna utama.","Putih sebagai latar.","Biru muda sebagai warna sokongan.","Hijau untuk status Approved.","Kuning untuk Pending.","Merah untuk Rejected."]},{type:"label",text:"Cadangan:"},{type:"ol",items:["Gunakan logo organisasi jika dibenarkan.","Gunakan warna yang konsisten.","Pastikan tulisan mudah dibaca.","Elakkan latar yang terlalu sarat.","Pastikan paparan sesuai untuk telefon."]}]},{id:"7.11",title:"7.11 Menguji UI dan UX",blocks:[{type:"p",text:"Selepas membina paparan, pembangun perlu menjalankan ujian penggunaan. Antara perkara yang perlu diperiksa:"},{type:"subheading",text:"Ujian Paparan"},{type:"ul",items:["Adakah menu mudah difahami?","Adakah ikon sesuai?","Adakah teks mudah dibaca?","Adakah maklumat penting mudah ditemui?"]},{type:"subheading",text:"Ujian Borang"},{type:"ul",items:["Adakah susunan medan logik?","Adakah arahan mudah difahami?","Adakah medan wajib ditandakan?","Adakah mesej ralat jelas?"]},{type:"subheading",text:"Ujian Navigasi"},{type:"ul",items:["Adakah pengguna boleh kembali ke paparan utama?","Adakah fungsi penting mudah dicapai?","Adakah terdapat menu yang tidak diperlukan?"]},{type:"subheading",text:"Ujian Peranti"},{type:"ul",items:["Uji menggunakan komputer.","Uji menggunakan telefon pintar.","Uji menggunakan tablet jika tersedia."]}]},{id:"7.12",title:"7.12 Aktiviti Amali: Membina Dashboard FBMS",blocks:[{type:"p",text:"Peserta perlu membina satu Dashboard yang boleh digunakan oleh pentadbir sistem."},{type:"subheading",text:"Tugasan 1: Sediakan Paparan"},{type:"p",text:"Pastikan peserta mempunyai: Semua Tempahan, Tempahan Pending, Tempahan Approved, Tempahan Rejected, Statistik Tempahan."},{type:"subheading",text:"Tugasan 2: Bina Dashboard"},{type:"p",text:"Gabungkan paparan yang telah disediakan dalam satu Dashboard."},{type:"subheading",text:"Tugasan 3: Susun Paparan"},{type:"ol",items:["Statistik keseluruhan.","Carta status tempahan.","Senarai tempahan terkini.","Senarai tempahan Pending."]},{type:"subheading",text:"Tugasan 4: Kemas Kini Reka Bentuk"},{type:"ul",items:["Tetapkan nama View yang sesuai.","Pilih ikon yang berkaitan.","Gunakan warna yang konsisten.","Susun menu utama.","Semak paparan telefon."]},{type:"subheading",text:"Tugasan 5: Ujian Pengguna"},{type:"p",text:"Minta rakan peserta menggunakan aplikasi dan menjawab soalan berikut:"},{type:"ol",items:["Adakah mudah mencari fungsi tempahan?","Adakah Dashboard mudah difahami?","Adakah borang mudah diisi?","Adakah maklumat dipaparkan dengan jelas?","Apakah penambahbaikan yang diperlukan?"]}]},{id:"7.13",title:"7.13 Latihan Pengukuhan",blocks:[{type:"quiz_mcq",questions:[{number:1,q:"Apakah maksud UI?",options:[{key:"A",text:"User Information"},{key:"B",text:"User Interface"},{key:"C",text:"Universal Internet"},{key:"D",text:"User Integration"}],answer:"B",explanation:"UI bermaksud User Interface, iaitu reka bentuk visual yang dilihat dan digunakan oleh pengguna."},{number:2,q:"Apakah maksud UX?",options:[{key:"A",text:"User Experience"},{key:"B",text:"User Extension"},{key:"C",text:"Universal Exchange"},{key:"D",text:"User Execution"}],answer:"A",explanation:"UX bermaksud User Experience, iaitu keseluruhan pengalaman pengguna ketika menggunakan aplikasi."},{number:3,q:"Apakah kegunaan Dashboard?",options:[{key:"A",text:"Memadamkan data"},{key:"B",text:"Menggabungkan beberapa paparan dalam satu ruang"},{key:"C",text:"Mengubah sumber data"},{key:"D",text:"Menghapuskan pengguna"}],answer:"B",explanation:"Dashboard menggabungkan beberapa View (seperti jadual dan carta) ke dalam satu skrin untuk pemantauan pantas."},{number:4,q:"View manakah sesuai untuk memaparkan statistik?",options:[{key:"A",text:"Form"},{key:"B",text:"Detail"},{key:"C",text:"Chart"},{key:"D",text:"Ref"}],answer:"C",explanation:"Chart View digunakan untuk memaparkan statistik dan analisis data dalam bentuk grafik seperti Column, Bar, Pie atau Line Chart."},{number:5,q:"Apakah tujuan Format Rules?",options:[{key:"A",text:"Mengubah penampilan rekod berdasarkan syarat"},{key:"B",text:"Menghapuskan Table"},{key:"C",text:"Menambah pengguna"},{key:"D",text:"Membina pangkalan data"}],answer:"A",explanation:"Format Rules menyerlahkan rekod menggunakan warna atau ikon apabila memenuhi syarat tertentu (cth. status Approved berwarna hijau)."},{number:6,q:"Apakah ciri UX yang baik?",options:[{key:"A",text:"Menu terlalu banyak"},{key:"B",text:"Pengguna perlu melalui banyak langkah"},{key:"C",text:"Fungsi mudah dicari dan digunakan"},{key:"D",text:"Semua maklumat dipaparkan dalam satu borang panjang"}],answer:"C",explanation:"UX yang baik memastikan menu mudah ditemui, borang ringkas tersusun dan fungsi mudah digunakan."}]}]},{id:"7.14",title:"7.14 Ringkasan Modul",blocks:[{type:"p",text:"Dalam modul ini, peserta telah mempelajari:"},{type:"ol",items:["Konsep UI dan UX.","Prinsip reka bentuk aplikasi.","Pemilihan View yang sesuai.","Pembinaan Dashboard.","Pembinaan Chart.","Reka bentuk borang.","Penggunaan ikon dan warna.","Penyusunan navigasi.","Branding dan Theme.","Ujian penggunaan aplikasi."]},{type:"p",text:"Reka bentuk UI dan UX yang baik dapat meningkatkan keselesaan pengguna dan menjadikan aplikasi lebih profesional."}]},{id:"7.15",title:"7.15 Hasil Pembelajaran Modul",blocks:[{type:"p",text:"Peserta dianggap menguasai modul ini apabila berjaya:"},{type:"ul",items:["Membina sekurang-kurangnya satu Dashboard.","Menggabungkan beberapa Views.","Membina sekurang-kurangnya satu Chart.","Menghasilkan borang yang tersusun.","Menetapkan ikon dan warna yang sesuai.","Menyusun navigasi aplikasi.","Menguji aplikasi melalui komputer dan telefon."]}]}]},ug={id:8,code:"MODUL 8",title:"Actions dan Automation dalam Google AppSheet",shortTitle:"Actions & Automation",subtitle:"8 jenis Actions, Grouped Actions, Bot/Event/Process/Step/Task, automasi e-mel kelulusan & penolakan, Scheduled Automation dan Automation Monitor.",pages:"Muka surat 95 – 112",duration:"90 minit",level:"Intermediate",sections:[{id:"8.1",title:"8.1 Pengenalan",blocks:[{type:"p",text:"Dalam pembangunan aplikasi, pengguna bukan sekadar melihat maklumat atau mengisi borang. Mereka juga perlu melakukan tindakan tertentu seperti menghantar permohonan, meluluskan rekod, menolak permohonan dan mengemaskini status."},{type:"p",text:"Google AppSheet menyediakan dua komponen penting untuk tujuan ini:"},{type:"ol",items:["Actions – membolehkan pengguna melakukan sesuatu tindakan melalui aplikasi.","Automation – membolehkan sistem melaksanakan proses secara automatik berdasarkan peristiwa atau syarat tertentu."]},{type:"label",text:"Contoh dalam Sistem Tempahan Bilik (FBMS):"},{type:"ul",items:["Pengguna menekan butang Hantar Tempahan.","Pegawai menekan butang Lulus.","Sistem mengemaskini status tempahan.","Sistem menghantar e-mel pemberitahuan.","Pentadbir menerima notifikasi apabila terdapat tempahan baharu."]},{type:"p",text:"Dengan Actions dan Automation, aplikasi boleh berfungsi seperti sebuah sistem pengurusan sebenar."}]},{id:"8.2",title:"8.2 Objektif Pembelajaran",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Memahami konsep Actions dan Automation.","Mengenal pasti jenis-jenis Actions.","Membina butang tindakan dalam aplikasi.","Mengemaskini data menggunakan Actions.","Membina proses kelulusan.","Memahami konsep Event, Process dan Task.","Membina Bot untuk automasi.","Menghantar notifikasi dan e-mel secara automatik.","Menguji proses automasi dalam aplikasi."]}]},{id:"8.3",title:"8.3 Memahami Actions",blocks:[{type:"p",text:"Action ialah arahan yang membolehkan pengguna melaksanakan sesuatu fungsi dalam aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Menukar status tempahan.","Membuka borang baharu.","Membuka paparan tertentu.","Membuka pautan laman web.","Menghantar pengguna ke rekod berkaitan.","Menjalankan beberapa tindakan secara berturutan."]},{type:"p",text:"Actions biasanya dipaparkan dalam bentuk butang atau pilihan tindakan pada rekod."},{type:"subheading",text:"Contoh Penggunaan Actions"},{type:"p",text:"Dalam FBMS, setiap tempahan mempunyai status: Pending, Approved, Rejected."},{type:"p",text:"Pegawai pelulus boleh diberikan dua butang: Luluskan Tempahan dan Tolak Tempahan. Apabila pegawai menekan butang Luluskan Tempahan, sistem akan mengemaskini Status kepada Approved."}]},{id:"8.4",title:"8.4 Jenis-Jenis Actions",blocks:[{type:"p",text:"AppSheet menyediakan beberapa jenis tindakan. Antara yang penting ialah:"},{type:"subheading",text:"A. Data: set the values of some columns in this row"},{type:"p",text:"Digunakan untuk menetapkan atau mengemaskini nilai Column dalam rekod semasa."},{type:"ul",items:["Mengubah Status kepada Approved.","Mengubah Status kepada Rejected.","Mengisi tarikh kelulusan."]},{type:"code",title:"Contoh penggunaan",code:`Column: Status
Nilai baharu: "Approved"`},{type:"subheading",text:"B. Data: add a new row to another table using values from this row"},{type:"p",text:"Digunakan untuk menambah rekod baharu ke Table lain berdasarkan maklumat daripada rekod semasa."},{type:"ul",items:["Apabila tempahan diluluskan, sistem menambah rekod dalam Table APPROVALS.","Maklumat BookingID dan ApprovedBy disalin ke rekod baharu."]},{type:"subheading",text:"C. Data: execute an action on a set of rows"},{type:"p",text:"Digunakan untuk menjalankan Action pada beberapa rekod yang memenuhi syarat tertentu."},{type:"ul",items:["Mengemaskini beberapa rekod tempahan.","Menjalankan tindakan terhadap semua rekod berkaitan."]},{type:"subheading",text:"D. Grouped: execute a sequence of actions"},{type:"p",text:"Digunakan untuk menggabungkan beberapa Actions dalam satu tindakan."},{type:"p",text:"Contoh — Apabila pegawai menekan butang Sahkan Kelulusan:"},{type:"ol",items:["Status ditukar kepada Approved.","Tarikh kelulusan direkodkan.","Maklumat pelulus direkodkan."]},{type:"p",text:"Semua tindakan tersebut boleh dijalankan melalui satu butang."},{type:"subheading",text:"E. App: go to another view within this app"},{type:"p",text:"Digunakan untuk membawa pengguna ke paparan lain dalam aplikasi. Contoh: Membuka Dashboard, Membuka Senarai Tempahan, Membuka borang baharu."},{type:"subheading",text:"F. App: open a form to add a new row to this table"},{type:"p",text:"Digunakan untuk membuka borang bagi menambah rekod baharu. Contoh: Membuka borang tempahan bilik, Membuka borang pendaftaran pengguna."},{type:"subheading",text:"G. External: go to a website"},{type:"p",text:"Digunakan untuk membuka pautan laman web luar. Contoh: Membuka laman web organisasi, Membuka sistem pembayaran, Membuka dokumen panduan."},{type:"subheading",text:"H. External: open a file"},{type:"p",text:"Digunakan untuk membuka fail yang berkaitan jika konfigurasi dan lokasi fail menyokong fungsi tersebut. Contoh: Membuka dokumen PDF, Membuka fail laporan, Membuka dokumen sokongan."},{type:"p",text:"Nama dan pilihan Action yang tersedia boleh berubah mengikut versi AppSheet."}]},{id:"8.5",title:"8.5 Cara Membina Action",blocks:[{type:"p",text:"Contoh: Membina butang Luluskan Tempahan."},{type:"subheading",text:"Langkah 1: Buka Actions"},{type:"ol",items:["Buka AppSheet Editor.","Pergi ke bahagian Actions.","Pilih New Action."]},{type:"subheading",text:"Langkah 2: Tetapkan Action"},{type:"code",code:`Action Name: Luluskan Tempahan
For a record of this table: BOOKINGS
Do this: Data: set the values of some columns in this row`},{type:"subheading",text:"Langkah 3: Tetapkan Nilai Column"},{type:"code",code:`Column: Status
Nilai: "Approved"`},{type:"subheading",text:"Langkah 4: Tetapkan Appearance"},{type:"ul",items:["Display Name: Luluskan Tempahan.","Icon: Check.","Prominence: Pilih paparan yang sesuai."]},{type:"subheading",text:"Langkah 5: Tetapkan Condition"},{type:"p",text:"Dalam bahagian Only if this condition is true, masukkan:"},{type:"code",code:'[Status] = "Pending"'},{type:"p",text:"Maksudnya, butang hanya tersedia apabila status tempahan masih Pending."},{type:"subheading",text:"Langkah 6: Simpan dan Uji"},{type:"ol",items:["Simpan perubahan.","Buka Preview aplikasi.","Pilih rekod tempahan yang masih Pending.","Tekan butang Luluskan Tempahan.","Semak sama ada Status berubah kepada Approved."]},{type:"callout",variant:"important",title:"Peringatan",text:"Condition pada Action mengawal sama ada butang boleh digunakan. Ia bukan pengganti kawalan keselamatan atau kebenaran data. Pastikan hanya pengguna yang dibenarkan boleh mengakses proses kelulusan."}]},{id:"8.6",title:"8.6 Membina Action Tolak Tempahan",blocks:[{type:"p",text:"Sekarang kita bina satu lagi Action untuk menolak permohonan."},{type:"ol",items:["Langkah 1: Buka Actions dan pilih New Action.","Langkah 2: Tetapkan Action Name: Tolak Tempahan | Table: BOOKINGS | Do this: Data: set the values of some columns in this row.",'Langkah 3: Tetapkan Column Status: "Rejected"','Langkah 4: Tetapkan Condition: [Status] = "Pending"',"Langkah 5: Tetapkan ikon dan nama paparan — Display Name: Tolak Tempahan, Icon: Cancel.","Langkah 6: Simpan dan uji aplikasi."]},{type:"callout",variant:"tip",title:"Cadangan",text:"Jika proses penolakan memerlukan sebab penolakan, sediakan borang atau proses untuk pegawai memasukkan sebab tersebut sebelum status ditukar kepada Rejected."}]},{id:"8.7",title:"8.7 Memahami Automation",blocks:[{type:"p",text:"Automation ialah fungsi yang membolehkan AppSheet melaksanakan sesuatu proses secara automatik."},{type:"p",text:"Automation berguna apabila sesuatu tindakan perlu dilakukan tanpa pengguna perlu melaksanakannya secara manual setiap kali."},{type:"label",text:"Contoh:"},{type:"ul",items:["Menghantar e-mel selepas tempahan dibuat.","Menghantar notifikasi selepas kelulusan.","Mengingatkan pengguna tentang tempahan.","Menghasilkan dokumen secara automatik.","Mengemaskini maklumat berdasarkan sesuatu peristiwa."]},{type:"label",text:"Automation dalam AppSheet menggunakan konsep utama berikut:"},{type:"ol",items:["Bot.","Event.","Process.","Step.","Task."]}]},{id:"8.8",title:"8.8 Memahami Bot, Event, Process, Step dan Task",blocks:[{type:"subheading",text:"A. Bot"},{type:"p",text:"Bot ialah komponen utama yang mengawal automasi. Bot menentukan bila automasi perlu bermula, proses yang perlu dilaksanakan dan tindakan yang perlu dilakukan."},{type:"p",text:"Contoh: Bot: Notifikasi Tempahan Baharu — Tujuan: Menghantar e-mel kepada pentadbir apabila tempahan baharu direkodkan."},{type:"subheading",text:"B. Event"},{type:"p",text:"Event ialah peristiwa yang mencetuskan Bot. Antara contoh Event:"},{type:"label",text:"Data Change Event"},{type:"p",text:"Dicetuskan apabila terdapat perubahan data seperti: ADD (rekod baharu ditambah), UPDATE (rekod dikemaskini), DELETE (rekod dipadam). Contoh: Apabila rekod baharu ditambah ke BOOKINGS, Bot akan bermula."},{type:"label",text:"Schedule Event"},{type:"p",text:"Dicetuskan mengikut jadual masa yang ditetapkan seperti: Setiap hari, Setiap minggu, Pada masa tertentu. Ketersediaan dan pelaksanaan jadual bergantung pada konfigurasi aplikasi, pelan dan had AppSheet."},{type:"subheading",text:"C. Process"},{type:"p",text:"Process ialah aliran kerja yang mengandungi satu atau beberapa langkah automasi. Contoh: Process: Proses Tempahan Baharu — Langkah: (1) Semak maklumat tempahan, (2) Tentukan penerima notifikasi, (3) Hantar e-mel kepada pentadbir."},{type:"subheading",text:"D. Step"},{type:"p",text:"Step ialah satu langkah dalam sesuatu Process. Contoh: Menjalankan tindakan, Menghantar e-mel, Menghasilkan dokumen, Menjalankan proses lain."},{type:"subheading",text:"E. Task"},{type:"p",text:"Task ialah tugasan khusus yang dilakukan dalam sesuatu Step. Contoh: Send an Email, Send a Notification, Create a File, Webhook."},{type:"code",title:"Ringkasan hubungan komponen Automation",code:`BOT
|
+-- EVENT
    |
    +-- PROCESS
        |
        +-- STEP 1
        |   |
        |   +-- TASK
        |
        +-- STEP 2
            |
            +-- TASK`}]},{id:"8.9",title:"8.9 Membina Bot Pertama: E-mel Tempahan Baharu",blocks:[{type:"p",text:"Dalam latihan ini, kita akan membina Bot yang menghantar e-mel kepada pentadbir apabila pengguna membuat tempahan bilik."},{type:"ol",items:["Langkah 1: Buka AppSheet Editor → Pergi ke Automation → Pilih Bots → Klik Create a new Bot.","Langkah 2: Namakan Bot: Bot Tempahan Baharu","Langkah 3: Tetapkan Event → Pilih Data Change Event → Table: BOOKINGS, Change Type: Adds (Bot dicetuskan apabila rekod baharu ditambah ke BOOKINGS).","Langkah 4: Bina Process baharu → Nama: Hantar Notifikasi Tempahan","Langkah 5: Tambah Step yang menggunakan Task untuk menghantar e-mel.","Langkah 6: Tetapkan Task → Pilih Send an Email."]},{type:"code",title:"Contoh konfigurasi Task Send an Email",code:`To:
Masukkan alamat e-mel pentadbir yang sebenar dan telah disahkan.

Subject:
Tempahan Bilik Baharu Diterima

Body:
Satu tempahan bilik baharu telah diterima.

Booking ID: <<[BookingID]>>
Pemohon: <<[UserEmail]>>
Tarikh Tempahan: <<[BookingDate]>>
Status: <<[Status]>>

Sila log masuk ke sistem untuk menyemak permohonan.`},{type:"p",text:"Placeholder seperti <<[BookingID]>> digunakan untuk memasukkan nilai daripada rekod semasa ke dalam kandungan e-mel."},{type:"subheading",text:"Langkah 7: Simpan Bot"},{type:"ol",items:["Simpan konfigurasi.","Pastikan Bot diaktifkan.","Uji dengan menambah satu rekod tempahan.","Semak Automation Monitor atau rekod pelaksanaan.","Semak sama ada e-mel diterima."]},{type:"callout",variant:"note",title:"Nota",text:"Penghantaran e-mel bergantung pada konfigurasi aplikasi, tetapan penghantaran, had penggunaan dan pelan AppSheet. Jangan anggap e-mel berjaya dihantar hanya kerana rekod telah disimpan."}]},{id:"8.10",title:"8.10 Membina Bot: Notifikasi Kelulusan Tempahan",blocks:[{type:"p",text:"Objektif: Apabila pegawai meluluskan tempahan, sistem akan menghantar e-mel kepada pemohon."},{type:"ol",items:["Langkah 1: Bina Bot Baharu — Nama: Bot Notifikasi Kelulusan","Langkah 2: Tetapkan Event — Pilih Data Change Event → Table: BOOKINGS, Change Type: Updates.","Langkah 3: Tetapkan Condition (lihat formula di bawah).","Langkah 4: Bina Process — Nama: Proses Notifikasi Kelulusan","Langkah 5: Tambah Task Send an Email."]},{type:"code",title:"Condition (Status berubah kepada Approved)",code:`AND(
  [_THISROW_BEFORE].[Status] <> "Approved",
  [_THISROW_AFTER].[Status] = "Approved"
)`},{type:"ul",items:["Status sebelum perubahan bukan Approved.","Status selepas perubahan ialah Approved.","Bot hanya akan diproses apabila perubahan status memenuhi syarat tersebut."]},{type:"code",title:"Tetapan Task Send an Email (Kelulusan)",code:`To: [UserEmail]
Subject: Permohonan Tempahan Anda Telah Diluluskan

Body:
Salam sejahtera,

Permohonan tempahan bilik anda telah diluluskan.

Booking ID: <<[BookingID]>>
Tarikh Tempahan: <<[BookingDate]>>
Status: <<[Status]>>

Sila rujuk sistem untuk maklumat lanjut.

Terima kasih.`},{type:"subheading",text:"Langkah 6: Simpan dan Uji"},{type:"ol",items:["Simpan Bot.","Buka aplikasi.","Pilih rekod Pending.","Jalankan Action Luluskan Tempahan.","Semak rekod Automation Monitor.","Pastikan e-mel dihantar kepada pemohon."]}]},{id:"8.11",title:"8.11 Membina Bot untuk Penolakan Tempahan",blocks:[{type:"p",text:"Proses ini hampir sama dengan notifikasi kelulusan."},{type:"code",title:"Event Condition",code:`AND(
  [_THISROW_BEFORE].[Status] <> "Rejected",
  [_THISROW_AFTER].[Status] = "Rejected"
)`},{type:"code",title:"Konfigurasi E-mel Penolakan",code:`Penerima: [UserEmail]
Subject: Permohonan Tempahan Anda Tidak Diluluskan

Body:
Salam sejahtera,

Dukacita dimaklumkan bahawa permohonan tempahan anda tidak diluluskan.

Booking ID: <<[BookingID]>>
Tarikh Tempahan: <<[BookingDate]>>
Status: <<[Status]>>

Sebab Penolakan: <<[RejectionReason]>>

Sila hubungi pihak pentadbir sekiranya memerlukan maklumat lanjut.

Terima kasih.`},{type:"p",text:"Pastikan Column RejectionReason telah disediakan dan diisi sebelum notifikasi dihantar."}]},{id:"8.12",title:"8.12 Membina Scheduled Automation",blocks:[{type:"p",text:"Scheduled Automation membolehkan sistem menjalankan sesuatu proses mengikut jadual."},{type:"ul",items:["Menghantar peringatan tempahan pada setiap pagi.","Menghasilkan laporan mingguan.","Menghantar ringkasan tempahan setiap hujung bulan."]},{type:"subheading",text:"Contoh: Peringatan Tempahan Esok"},{type:"p",text:"Objektif: Sistem menghantar peringatan kepada pengguna yang mempunyai tempahan pada hari berikutnya."},{type:"code",title:"Contoh syarat rekod",code:`AND(
  [BookingDate] = TODAY() + 1,
  [Status] = "Approved"
)`},{type:"ul",items:["Tarikhnya ialah esok.","Statusnya Approved."]},{type:"label",text:"Langkah umum:"},{type:"ol",items:["Buka Automation.","Cipta Bot baharu.","Pilih Scheduled Event.","Tetapkan jadual harian.","Bina Process.","Tambah langkah untuk mendapatkan rekod tempahan yang berkaitan.","Gunakan Task Send an Email.","Tetapkan penerima berdasarkan UserEmail.","Simpan dan uji automasi."]},{type:"callout",variant:"warning",title:"Perhatian",text:"Untuk memproses banyak rekod, reka bentuk Process perlu mengambil kira senarai rekod yang memenuhi syarat. Jangan menganggap Scheduled Bot secara automatik menghantar satu e-mel bagi setiap rekod tanpa konfigurasi langkah pemprosesan yang sesuai."}]},{id:"8.13",title:"8.13 Menggunakan Grouped Actions",blocks:[{type:"p",text:"Grouped Action membolehkan beberapa tindakan dilaksanakan melalui satu butang."},{type:"p",text:"Contoh — Butang: Sahkan Kelulusan. Tindakan yang digabungkan:"},{type:"ol",items:["Tukar Status kepada Approved.","Isi ApprovedDate dengan tarikh semasa.","Isi ApprovedBy dengan e-mel pegawai pelulus."]},{type:"code",title:"Contoh nilai yang digunakan",code:`Status: "Approved"
ApprovedDate: TODAY()
ApprovedBy: USEREMAIL()`},{type:"label",text:"Langkah umum:"},{type:"ol",items:["Cipta Action pertama untuk mengemaskini Status.","Cipta Action kedua untuk mengisi ApprovedDate.","Cipta Action ketiga untuk mengisi ApprovedBy.","Cipta Action baharu.","Pilih Grouped: execute a sequence of actions.","Masukkan ketiga-tiga Action mengikut susunan.","Simpan dan uji."]},{type:"callout",variant:"important",title:"Penting",text:"Pastikan semua Action menggunakan Table dan rekod yang betul. Jika terdapat keperluan kelulusan rasmi, kawalan akses dan rekod audit juga perlu dibina."}]},{id:"8.14",title:"8.14 Automation Monitor",blocks:[{type:"p",text:"Automation Monitor digunakan untuk menyemak pelaksanaan automasi."},{type:"label",text:"Melalui Monitor, pembangun boleh menyemak:"},{type:"ul",items:["Bot yang dijalankan.","Event yang mencetuskan Bot.","Process yang dilaksanakan.","Task yang berjaya.","Task yang gagal.","Mesej ralat."]},{type:"subheading",text:"Cara Menyemak Ralat"},{type:"ol",items:["Buka AppSheet Editor.","Pergi ke bahagian Automation.","Buka Monitor atau Execution History.","Pilih pelaksanaan Bot.","Semak setiap Step.","Kenal pasti mesej ralat.","Baiki konfigurasi.","Jalankan ujian semula."]},{type:"subheading",text:"Punca Automasi Gagal"},{type:"ol",items:["Alamat e-mel penerima tidak sah.","Nama Column tidak tepat.","Formula mempunyai ralat.","Bot tidak diaktifkan.","Event tidak dicetuskan.","Task tidak dikonfigurasikan dengan betul.","Had penggunaan atau pelan tidak menyokong proses tertentu.","Pengguna atau sumber data tidak mempunyai kebenaran yang diperlukan."]}]},{id:"8.15",title:"8.15 Amalan Terbaik Actions dan Automation",blocks:[{type:"p",text:"Untuk memastikan automasi berjalan dengan baik:"},{type:"ol",items:["Gunakan nama Bot dan Action yang mudah difahami.","Pastikan setiap Event mempunyai tujuan yang jelas.","Gunakan Condition untuk mengelakkan automasi tidak diperlukan.","Elakkan menghantar e-mel berulang kali.","Uji setiap proses menggunakan data contoh.","Semak Automation Monitor.","Rekodkan tindakan penting untuk tujuan audit.","Pastikan akses pengguna dikawal.","Jangan dedahkan maklumat sensitif dalam notifikasi.","Sediakan proses pemulihan jika automasi gagal."]}]},{id:"8.16",title:"8.16 Aktiviti Amali: Membina Sistem Kelulusan FBMS",blocks:[{type:"p",text:"Dalam aktiviti ini, peserta akan membina proses kelulusan tempahan secara lengkap."},{type:"subheading",text:"Tugasan 1: Bina Action Luluskan"},{type:"ul",items:["Table: BOOKINGS.","Action: Luluskan Tempahan.","Tukar Status kepada Approved.","Tetapkan syarat Status Pending."]},{type:"subheading",text:"Tugasan 2: Bina Action Tolak"},{type:"ul",items:["Table: BOOKINGS.","Action: Tolak Tempahan.","Tukar Status kepada Rejected.","Tetapkan syarat Status Pending."]},{type:"subheading",text:"Tugasan 3: Bina Grouped Action"},{type:"ul",items:["Tukar Status.","Isi tarikh kelulusan.","Isi e-mel pegawai pelulus."]},{type:"subheading",text:"Tugasan 4: Bina Bot Tempahan Baharu"},{type:"ul",items:["Event: Rekod baharu ditambah.","Process: Notifikasi tempahan.","Task: Send an Email."]},{type:"subheading",text:"Tugasan 5: Bina Bot Kelulusan"},{type:"ul",items:["Event: Rekod dikemaskini.","Condition: Status berubah kepada Approved.","Task: Hantar e-mel kepada pemohon."]},{type:"subheading",text:"Tugasan 6: Bina Bot Penolakan"},{type:"ul",items:["Event: Rekod dikemaskini.","Condition: Status berubah kepada Rejected.","Task: Hantar e-mel kepada pemohon."]},{type:"subheading",text:"Tugasan 7: Ujian Sistem"},{type:"table",title:"Uji senario berikut:",headers:["Senario","Tindakan Dijangka"],rows:[["Pengguna membuat tempahan","Status menjadi Pending"],["Pegawai meluluskan tempahan","Status menjadi Approved"],["Pegawai menolak tempahan","Status menjadi Rejected"],["Tempahan diluluskan","E-mel kelulusan dihantar"],["Tempahan ditolak","E-mel penolakan dihantar"]]}]},{id:"8.17",title:"8.17 Latihan Pengukuhan",blocks:[{type:"quiz_mcq",questions:[{number:1,q:"Apakah fungsi Actions?",options:[{key:"A",text:"Menguruskan warna aplikasi sahaja"},{key:"B",text:"Membolehkan pengguna melaksanakan tindakan tertentu"},{key:"C",text:"Menyimpan fail dalam komputer"},{key:"D",text:"Membina pangkalan data secara automatik"}],answer:"B",explanation:"Actions membolehkan pengguna melaksanakan operasi seperti menukar status, membuka paparan atau menambah rekod melalui butang tindakan."},{number:2,q:"Apakah fungsi Automation?",options:[{key:"A",text:"Melaksanakan proses secara automatik berdasarkan peristiwa atau jadual"},{key:"B",text:"Mengubah warna butang sahaja"},{key:"C",text:"Menambah gambar secara manual"},{key:"D",text:"Menghapuskan semua rekod"}],answer:"A",explanation:"Automation menjalankan aliran kerja secara automatik apabila Data Change Event atau Schedule Event tercetus."},{number:3,q:"Apakah yang dimaksudkan dengan Event?",options:[{key:"A",text:"Paparan utama aplikasi"},{key:"B",text:"Peristiwa yang mencetuskan automasi"},{key:"C",text:"Jenis Column"},{key:"D",text:"Nama pengguna"}],answer:"B",explanation:"Event ialah pencetus (trigger) kepada Bot, sama ada perubahan data (ADD/UPDATE/DELETE) atau jadual masa."},{number:4,q:"Apakah fungsi Process?",options:[{key:"A",text:"Menyimpan gambar"},{key:"B",text:"Mengandungi langkah-langkah proses automasi"},{key:"C",text:"Mengubah jenis data"},{key:"D",text:"Menguruskan warna"}],answer:"B",explanation:"Process ialah aliran kerja yang merangkumi satu atau beberapa Step dan Task untuk dilaksanakan oleh Bot."},{number:5,q:"Apakah kegunaan Task Send an Email?",options:[{key:"A",text:"Menghantar e-mel secara automatik"},{key:"B",text:"Memadamkan rekod"},{key:"C",text:"Membina View"},{key:"D",text:"Mengubah Key"}],answer:"A",explanation:"Task Send an Email menghantar e-mel notifikasi secara automatik dengan sokongan placeholder seperti <<[BookingID]>>."},{number:6,q:"Apakah fungsi Grouped Action?",options:[{key:"A",text:"Menggabungkan beberapa Actions dalam satu tindakan"},{key:"B",text:"Menggabungkan beberapa Google Sheets"},{key:"C",text:"Memadamkan beberapa Table"},{key:"D",text:"Mengubah semua Column"}],answer:"A",explanation:"Grouped Action melaksanakan beberapa Actions secara berturutan melalui satu butang sahaja."},{number:7,q:"Di manakah pembangun boleh menyemak pelaksanaan dan ralat automasi?",options:[{key:"A",text:"Data"},{key:"B",text:"Monitor"},{key:"C",text:"Columns"},{key:"D",text:"Branding"}],answer:"B",explanation:"Automation Monitor (atau Execution History) memaparkan status Bot, Event, Process, Task yang berjaya/gagal serta mesej ralat."}]}]},{id:"8.18",title:"8.18 Ringkasan Modul",blocks:[{type:"p",text:"Dalam modul ini, peserta telah mempelajari:"},{type:"ol",items:["Konsep Actions.","Jenis-jenis Actions.","Cara membina butang tindakan.","Grouped Actions.","Konsep Automation.","Bot, Event, Process, Step dan Task.","Automasi penghantaran e-mel.","Automasi kelulusan dan penolakan.","Scheduled Automation.","Automation Monitor.","Penyelesaian masalah automasi."]},{type:"p",text:"Actions dan Automation membolehkan aplikasi melaksanakan proses kerja dengan lebih cekap dan mengurangkan kebergantungan kepada tindakan manual."}]},{id:"8.19",title:"8.19 Hasil Pembelajaran Modul & Persediaan ke Modul 9",blocks:[{type:"p",text:"Peserta dianggap menguasai modul ini apabila berjaya:"},{type:"ul",items:["Membina sekurang-kurangnya dua Actions.","Menghasilkan Grouped Action.","Membina sekurang-kurangnya satu Bot.","Menggunakan Data Change Event.","Menghasilkan Task Send an Email.","Membina proses notifikasi kelulusan.","Menyemak pelaksanaan melalui Automation Monitor."]},{type:"callout",variant:"tip",title:"Persediaan ke Modul 9",text:"Modul terakhir akan membincangkan Security, User Access, Deployment, Testing dan Publishing. Peserta akan belajar bagaimana menyediakan aplikasi supaya boleh digunakan oleh pengguna sebenar dengan lebih selamat dan teratur."}]}]},og={id:9,code:"MODUL 9",title:"Security, User Access, Deployment dan Publishing",shortTitle:"Security & Deployment",subtitle:"Authentication, Authorization, Data Security, Require Sign-In, kawalan akses Role, Security Filters vs Slice, Deployment Check, UAT, pengurusan ralat dan senarai semak deployment.",pages:"Muka surat 113 – 132",duration:"90 minit",level:"Intermediate",sections:[{id:"9.1",title:"9.1 Pengenalan",blocks:[{type:"p",text:"Selepas aplikasi dibangunkan, pembangun perlu memastikan aplikasi tersebut boleh digunakan oleh pengguna sebenar dengan selamat dan stabil."},{type:"label",text:"Antara perkara yang perlu diberi perhatian ialah:"},{type:"ol",items:["Keselamatan data.","Pengesahan identiti pengguna.","Kawalan akses pengguna.","Pengurusan peranan pengguna.","Ujian fungsi aplikasi.","Pengurusan ralat.","Deployment aplikasi.","Pemantauan aplikasi selepas digunakan."]},{type:"p",text:"Contohnya, dalam Facility Booking Management System (FBMS), bukan semua pengguna boleh mengakses semua fungsi. Pengguna biasa hanya perlu membuat tempahan dan melihat tempahan sendiri. Pegawai pelulus perlu melihat permohonan yang perlu diluluskan. Pentadbir pula perlu menguruskan keseluruhan sistem."},{type:"p",text:"Oleh itu, aplikasi perlu dibangunkan dengan sistem keselamatan dan kawalan akses yang sesuai."}]},{id:"9.2",title:"9.2 Objektif Pembelajaran",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Memahami konsep keselamatan AppSheet.","Mengaktifkan pengesahan pengguna.","Menguruskan senarai pengguna aplikasi.","Memahami peranan dan kebenaran pengguna.","Menggunakan Security Filters.","Membezakan Slice dengan Security Filter.","Melaksanakan ujian aplikasi.","Memahami proses Deployment.","Menyediakan aplikasi untuk pengguna sebenar.","Menguruskan aplikasi selepas diterbitkan."]}]},{id:"9.3",title:"9.3 Memahami Keselamatan Aplikasi",blocks:[{type:"p",text:"Keselamatan aplikasi ialah proses melindungi data dan fungsi sistem daripada akses yang tidak dibenarkan. Dalam AppSheet, keselamatan perlu dilihat daripada beberapa aspek."},
