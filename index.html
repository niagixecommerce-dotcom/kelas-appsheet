.jsx("div",{className:`pointer-events-none select-none absolute ${a} w-72 h-72 rounded-full opacity-90 blur-[2px] ${t}`,style:{background:"radial-gradient(circle at 30% 30%, #FACC15 0%, #F97316 48%, #B91C1C 100%)"}})}const ag={id:1,code:"MODUL 1",title:"Pengenalan Kepada Google AppSheet",shortTitle:"Pengenalan AppSheet",subtitle:"Memahami konsep No-Code, ekosistem asas, komponen utama dan keperluan permulaan Google AppSheet.",pages:"Muka surat 1 – 4",duration:"30 minit",level:"Beginner",sections:[{id:"1.1",title:"1.1 OBJEKTIF PEMBELAJARAN",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Memahami konsep pembangunan aplikasi tanpa kod (No-Code).","Menjelaskan fungsi dan kegunaan Google AppSheet.","Mengenal pasti komponen utama dalam ekosistem AppSheet.","Memahami hubungan antara Google Sheets dengan AppSheet.","Mengenal pasti jenis aplikasi yang boleh dibangunkan menggunakan AppSheet."]}]},{id:"1.2",title:"1.2 APAKAH GOOGLE APPSHEET?",blocks:[{type:"p",text:"Google AppSheet merupakan platform pembangunan aplikasi tanpa kod (No-Code Application Development Platform) yang membolehkan pengguna membina aplikasi perniagaan dan pengurusan data tanpa perlu mempunyai kemahiran pengaturcaraan."},{type:"p",text:"Melalui platform ini, pengguna boleh membangunkan aplikasi dengan menggunakan kaedah konfigurasi visual."},{type:"p",text:"Pengguna hanya perlu menyediakan sumber data, menentukan struktur aplikasi dan menetapkan fungsi yang diperlukan melalui AppSheet Editor."},{type:"p",text:"Aplikasi yang dibangunkan boleh digunakan melalui telefon pintar, tablet dan pelayar web komputer."}]},{id:"1.3",title:"1.3 APAKAH MAKSUD NO-CODE?",blocks:[{type:"p",text:"No-Code merujuk kepada pendekatan pembangunan aplikasi yang tidak memerlukan pengguna menulis kod pengaturcaraan secara tradisional."},{type:"p",text:"Dalam pembangunan sistem konvensional, pembangun biasanya perlu menggunakan bahasa pengaturcaraan seperti:"},{type:"ul",items:["Python","Java","PHP","JavaScript","C#"]},{type:"p",text:"Namun, melalui AppSheet, pengguna boleh membangunkan aplikasi menggunakan konfigurasi visual yang disediakan."},{type:"p",text:"Walau bagaimanapun, AppSheet turut menyediakan Expression dan formula tersendiri untuk menghasilkan fungsi yang lebih kompleks."}]},{id:"1.4",title:"1.4 BAGAIMANAKAH GOOGLE APPSHEET BERFUNGSI?",blocks:[{type:"p",text:"Secara asasnya, AppSheet menggunakan tiga komponen utama:"},{type:"subheading",text:"A. DATA SOURCE"},{type:"p",text:"Data Source ialah sumber data yang digunakan oleh aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Google Sheets","Microsoft Excel","Cloud SQL","Pangkalan data lain yang disokong."]},{type:"subheading",text:"B. APPSHEET EDITOR"},{type:"p",text:"AppSheet Editor merupakan ruang kerja untuk membangunkan aplikasi."},{type:"label",text:"Melalui editor ini, pengguna boleh:"},{type:"ul",items:["Membina struktur aplikasi.","Menetapkan jadual dan lajur.","Menghasilkan borang.","Menyusun paparan aplikasi.","Menetapkan formula.","Membina automasi."]},{type:"subheading",text:"C. APPLICATION INTERFACE"},{type:"p",text:"Application Interface ialah antaramuka aplikasi yang digunakan oleh pengguna akhir."},{type:"label",text:"Contohnya:"},{type:"ul",items:["Borang pendaftaran.","Senarai rekod.","Paparan dashboard.","Laporan.","Paparan butiran rekod."]}]},{id:"1.5",title:"1.5 CONTOH PENGGUNAAN GOOGLE APPSHEET",blocks:[{type:"p",text:"Google AppSheet boleh digunakan untuk membangunkan pelbagai jenis aplikasi."},{type:"label",text:"Antaranya:"},{type:"ol",items:["Sistem Pengurusan Inventori.","Sistem Kehadiran Staf.","Sistem Pengurusan Pelajar.","Sistem Tempahan Bilik.","Sistem Pengurusan Aduan.","Sistem Pengurusan Aset.","Sistem Pemantauan Projek.","Sistem Pengurusan Pelanggan.","Sistem Pemeriksaan Keselamatan.","Sistem Pengurusan Tuntutan."]}]},{id:"1.6",title:"1.6 KELEBIHAN GOOGLE APPSHEET",blocks:[{type:"p",text:"Antara kelebihan menggunakan AppSheet ialah:"},{type:"ol",items:["Tidak memerlukan kemahiran pengaturcaraan tradisional.","Mempercepatkan proses pembangunan aplikasi.","Menyokong penggunaan peranti mudah alih dan komputer.","Boleh menggunakan Google Sheets sebagai sumber data.","Menyediakan fungsi borang digital.","Menyediakan fungsi pengurusan data.","Menyokong automasi proses kerja.","Menyediakan paparan dashboard dan laporan.","Membolehkan aplikasi dikongsi dengan pengguna yang dibenarkan."]}]},{id:"1.7",title:"1.7 KEPERLUAN ASAS UNTUK MENGGUNAKAN APPSHEET",blocks:[{type:"p",text:"Sebelum memulakan pembangunan aplikasi, pengguna perlu menyediakan:"},{type:"ol",items:["Akaun Google.","Akses kepada Google Sheets.","Sambungan internet.","Akses kepada Google AppSheet.","Komputer atau telefon pintar."]},{type:"links",items:[{label:"Laman rasmi Google AppSheet",url:"https://www.appsheet.com/"},{label:"Pusat bantuan AppSheet",url:"https://support.google.com/appsheet/"}]}]},{id:"1.8",title:"1.8 LATIHAN PENGUKUHAN",blocks:[{type:"quiz_open",intro:"Jawab soalan berikut:",questions:[{q:"Apakah yang dimaksudkan dengan Google AppSheet?",guide:"Google AppSheet merupakan platform pembangunan aplikasi tanpa kod (No-Code Application Development Platform) yang membolehkan pengguna membina aplikasi perniagaan dan pengurusan data melalui kaedah konfigurasi visual tanpa perlu menulis kod pengaturcaraan tradisional."},{q:"Apakah maksud pembangunan aplikasi No-Code?",guide:"No-Code merujuk kepada pendekatan pembangunan aplikasi yang tidak memerlukan pengguna menulis kod pengaturcaraan secara tradisional (seperti Python, Java, PHP, JavaScript atau C#), sebaliknya menggunakan konfigurasi visual, dengan sokongan Expression dan formula tersendiri bagi fungsi yang lebih kompleks."},{q:"Nyatakan tiga contoh sumber data yang boleh digunakan dalam pembangunan aplikasi.",guide:"Google Sheets, Microsoft Excel, Cloud SQL (serta pangkalan data lain yang disokong)."},{q:"Apakah fungsi AppSheet Editor?",guide:"AppSheet Editor ialah ruang kerja untuk membangunkan aplikasi di mana pengguna boleh membina struktur aplikasi, menetapkan jadual dan lajur, menghasilkan borang, menyusun paparan aplikasi, menetapkan formula dan membina automasi."},{q:"Nyatakan lima contoh aplikasi yang boleh dibangunkan menggunakan AppSheet.",guide:"Mana-mana lima: Sistem Pengurusan Inventori, Sistem Kehadiran Staf, Sistem Pengurusan Pelajar, Sistem Tempahan Bilik, Sistem Pengurusan Aduan, Sistem Pengurusan Aset, Sistem Pemantauan Projek, Sistem Pengurusan Pelanggan, Sistem Pemeriksaan Keselamatan, Sistem Pengurusan Tuntutan."},{q:"Apakah kelebihan menggunakan AppSheet berbanding pembangunan aplikasi secara tradisional?",guide:"Tidak memerlukan kemahiran pengaturcaraan tradisional, mempercepatkan proses pembangunan aplikasi, menyokong peranti mudah alih & komputer, menggunakan Google Sheets sebagai sumber data, menyediakan borang digital, pengurusan data, automasi, dashboard/laporan, dan perkongsian terkawal."}]}]},{id:"1.9",title:"1.9 AKTIVITI AMALI",blocks:[{type:"subheading",text:"Aktiviti: Mengenali Platform Google AppSheet"},{type:"label",text:"Arahan:"},{type:"ol",items:["Buka pelayar web.","Layari https://www.appsheet.com/","Log masuk menggunakan akaun Google.","Kenal pasti paparan utama AppSheet.","Terokai bahagian aplikasi dan AppSheet Editor.","Catatkan fungsi yang terdapat dalam platform tersebut."]}]},{id:"1.10",title:"1.10 RUMUSAN MODUL",blocks:[{type:"p",text:"Google AppSheet merupakan platform pembangunan aplikasi No-Code yang memudahkan pengguna membina aplikasi tanpa perlu menulis kod pengaturcaraan tradisional."},{type:"p",text:"Dengan memahami konsep asas AppSheet, peserta akan mempunyai pengetahuan awal untuk meneruskan pembelajaran kepada penyediaan sumber data, pembinaan aplikasi, konfigurasi fungsi dan automasi sistem."}]}]},tg={id:2,code:"MODUL 2",title:"Kegunaan, Fungsi dan Ekosistem Google AppSheet",shortTitle:"Fungsi & Ekosistem",subtitle:"Mendalami operasi CRUD, borang digital, visualisasi data, automasi, actions, keselamatan, ekosistem Google dan kajian kes.",pages:"Muka surat 5 – 14",duration:"45 minit",level:"Beginner",sections:[{id:"2.1",title:"2.1 OBJEKTIF PEMBELAJARAN",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Mengenal pasti fungsi utama Google AppSheet.","Memahami komponen dan ekosistem pembangunan AppSheet.","Menjelaskan bagaimana AppSheet membantu mengurus proses kerja organisasi.","Memahami jenis data yang boleh digunakan dalam aplikasi.","Mengenal pasti fungsi asas dan lanjutan AppSheet.","Membezakan aplikasi mudah dengan aplikasi yang mempunyai aliran kerja automatik.","Mengenal pasti batasan dan perkara yang perlu dipertimbangkan sebelum membangunkan aplikasi."]}]},{id:"2.2",title:"2.2 FUNGSI UTAMA GOOGLE APPSHEET",blocks:[{type:"p",text:"Google AppSheet menyediakan pelbagai fungsi yang membolehkan pengguna membina aplikasi untuk menyelesaikan masalah pengurusan dan operasi organisasi."},{type:"p",text:"Antara fungsi utamanya ialah:"},{type:"subheading",text:"A. DATA MANAGEMENT (PENGURUSAN DATA)"},{type:"p",text:"Fungsi ini membolehkan pengguna menyimpan, membaca, mengemas kini dan memadam rekod melalui aplikasi."},{type:"p",text:"Empat operasi asas pengurusan data dikenali sebagai CRUD:"},{type:"ol",items:["Create – Menambah rekod baharu.","Read – Melihat atau membaca rekod.","Update – Mengemas kini rekod sedia ada.","Delete – Memadam rekod."]},{type:"label",text:"Contoh:"},{type:"p",text:"Dalam sistem pengurusan inventori, pengguna boleh:"},{type:"ul",items:["Mendaftarkan barang baharu.","Melihat senarai barang.","Mengemas kini kuantiti stok.","Memadam rekod barang yang tidak lagi digunakan."]},{type:"subheading",text:"B. DIGITAL FORM (BORANG DIGITAL)"},{type:"p",text:"AppSheet membolehkan pengguna menghasilkan borang digital untuk mengumpul maklumat."},{type:"label",text:"Contoh penggunaan:"},{type:"ul",items:["Borang pendaftaran peserta.","Borang permohonan cuti.","Borang tempahan bilik.","Borang laporan kerosakan.","Borang pemeriksaan aset."]},{type:"label",text:"Antara jenis medan yang boleh digunakan termasuk:"},{type:"ul",items:["Text – Memasukkan teks.","Name – Memasukkan nama.","Email – Memasukkan alamat e-mel.","Phone – Memasukkan nombor telefon.","Number – Memasukkan nombor.","Date – Memilih tarikh.","DateTime – Memilih tarikh dan masa.","Time – Memilih masa.","Enum – Memilih satu pilihan daripada senarai.","EnumList – Memilih beberapa pilihan.","Yes/No – Pilihan ya atau tidak.","Image – Memuat naik atau mengambil gambar.","File – Melampirkan fail.","Signature – Merekod tandatangan.","Location – Merekod lokasi."]},{type:"p",text:"Jenis medan yang tersedia bergantung pada konfigurasi dan sokongan platform."},{type:"subheading",text:"C. DATA VISUALIZATION (PAPARAN DATA)"},{type:"p",text:"AppSheet membolehkan data dipaparkan dalam beberapa bentuk supaya pengguna mudah memahami maklumat."},{type:"label",text:"Antara paparan yang boleh digunakan:"},{type:"ol",items:["Table View – Memaparkan data dalam bentuk jadual.","Deck View – Memaparkan rekod dalam bentuk kad.","Gallery View – Memaparkan rekod dengan imej.","Detail View – Memaparkan maklumat terperinci sesuatu rekod.","Form View – Memaparkan borang untuk memasukkan data.","Chart View – Memaparkan data dalam bentuk carta.","Dashboard View – Menggabungkan beberapa paparan dalam satu skrin.","Calendar View – Memaparkan rekod mengikut tarikh.","Map View – Memaparkan rekod berdasarkan lokasi."]},{type:"p",text:"Pemilihan jenis paparan bergantung pada tujuan aplikasi dan keperluan pengguna."},{type:"subheading",text:"D. AUTOMATION (AUTOMASI)"},{type:"p",text:"Automation membolehkan aplikasi melaksanakan sesuatu tindakan secara automatik apabila syarat atau peristiwa tertentu berlaku."},{type:"label",text:"Contoh:"},{type:"ol",items:["Menghantar e-mel apabila permohonan diterima.","Menghantar notifikasi apabila stok mencapai tahap minimum.","Menghasilkan dokumen apabila tempahan diluluskan.","Menghantar peringatan apabila tarikh tamat tempoh semakin hampir.","Mengemas kini proses kerja berdasarkan sesuatu peristiwa."]},{type:"label",text:"Automation biasanya dibina menggunakan komponen seperti:"},{type:"ul",items:["Event – Peristiwa yang mencetuskan automasi.","Process – Aliran proses yang perlu dilaksanakan.","Step – Langkah yang terdapat dalam proses.","Task – Tindakan yang perlu dilaksanakan."]},{type:"label",text:"Contoh aliran:"},{type:"code",title:"Aliran Proses Automasi",code:"Pengguna menghantar permohonan → Sistem mengesan rekod baharu → Sistem menjalankan proses → E-mel pemberitahuan dihantar."},{type:"subheading",text:"E. ACTIONS (TINDAKAN)"},{type:"p",text:"Actions membolehkan pengguna melaksanakan sesuatu operasi melalui butang atau tindakan tertentu dalam aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Butang Approve untuk meluluskan permohonan.","Butang Reject untuk menolak permohonan.","Butang Update untuk mengemas kini rekod.","Butang Navigate untuk membuka paparan tertentu.","Butang Call untuk membuat panggilan telefon.","Butang Email untuk membuka fungsi e-mel."]},{type:"p",text:"Actions boleh digunakan untuk menjadikan aplikasi lebih interaktif."},{type:"subheading",text:"F. SECURITY AND ACCESS CONTROL (KESELAMATAN DAN KAWALAN AKSES)"},{type:"p",text:"AppSheet menyediakan fungsi keselamatan untuk mengawal penggunaan aplikasi."},{type:"label",text:"Antara fungsi yang boleh digunakan:"},{type:"ol",items:["User Authentication – Pengesahan identiti pengguna.","Require Sign-In – Menghendaki pengguna log masuk.","Security Filters – Mengehadkan rekod yang dihantar kepada pengguna berdasarkan syarat tertentu.","User Roles – Mengurus peranan pengguna menggunakan konfigurasi aplikasi.","Access Control – Mengawal siapa yang boleh mengakses aplikasi dan data."]},{type:"label",text:"Contoh:"},{type:"p",text:"Dalam sistem pengurusan pelajar:"},{type:"ul",items:["Admin boleh melihat semua rekod.","Pensyarah boleh melihat rekod pelajar yang berkaitan dengannya.","Pelajar hanya boleh melihat maklumat rekod sendiri."]},{type:"callout",variant:"important",title:"PENTING",text:"Security Filter dan kawalan akses perlu dikonfigurasikan dengan betul. Menyembunyikan sesuatu paparan atau butang sahaja tidak bermaksud data tersebut telah dilindungi."}]},{id:"2.3",title:"2.3 MEMAHAMI EKOSISTEM GOOGLE APPSHEET",blocks:[{type:"p",text:"Untuk membangunkan aplikasi yang berfungsi dengan baik, peserta perlu memahami hubungan antara AppSheet dengan platform lain."},{type:"subheading",text:"A. GOOGLE SHEETS"},{type:"p",text:"Google Sheets boleh digunakan sebagai sumber data utama untuk aplikasi AppSheet."},{type:"label",text:"Fungsinya:"},{type:"ul",items:["Menyimpan rekod.","Menyediakan struktur jadual.","Menyimpan maklumat pengguna.","Menyimpan transaksi.","Membolehkan data disemak dan dikemas kini."]},{type:"label",text:"Contoh:"},{type:"p",text:"Sistem tempahan bilik boleh menggunakan Google Sheets yang mempunyai jadual:"},{type:"ol",items:["Users","Rooms","Bookings","Approvals"]},{type:"p",text:"Setiap jadual menyimpan jenis maklumat yang berbeza."},{type:"subheading",text:"B. GOOGLE DRIVE"},{type:"p",text:"Google Drive digunakan untuk menyimpan fail dan dokumen yang berkaitan dengan aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Gambar produk.","Dokumen permohonan.","Lampiran laporan.","Fail PDF.","Dokumen yang dijana melalui automasi."]},{type:"subheading",text:"C. GMAIL"},{type:"p",text:"Gmail boleh digunakan dalam proses pemberitahuan melalui fungsi e-mel AppSheet."},{type:"label",text:"Contoh:"},{type:"ul",items:["Pemberitahuan permohonan baharu.","Pengesahan tempahan.","Makluman kelulusan.","Peringatan kepada pengguna."]},{type:"p",text:"Ketersediaan fungsi penghantaran e-mel bergantung pada konfigurasi dan pelan penggunaan."},{type:"subheading",text:"D. GOOGLE DOCS"},{type:"p",text:"Google Docs boleh digunakan sebagai templat dokumen untuk menghasilkan dokumen secara automatik."},{type:"label",text:"Contoh:"},{type:"ul",items:["Surat kelulusan.","Surat pengesahan.","Borang tempahan.","Laporan rasmi."]},{type:"p",text:"Melalui proses automasi, data daripada aplikasi boleh dimasukkan ke dalam templat dokumen yang disediakan."},{type:"subheading",text:"E. GOOGLE CALENDAR"},{type:"p",text:"Google Calendar boleh digunakan dalam aliran kerja yang melibatkan pengurusan jadual dan tarikh."},{type:"label",text:"Contoh:"},{type:"ul",items:["Pengurusan jadual tempahan.","Penyelarasan aktiviti.","Pengurusan tarikh mesyuarat."]},{type:"p",text:"Integrasi dan kaedah pelaksanaannya bergantung pada ciri serta sambungan yang tersedia."}]},{id:"2.4",title:"2.4 MEMAHAMI JENIS PENGGUNA APLIKASI",blocks:[{type:"p",text:"Dalam pembangunan aplikasi, pengguna boleh dibahagikan mengikut peranan."},{type:"label",text:"Contoh pembahagian pengguna:"},{type:"subheading",text:"A. ADMINISTRATOR"},{type:"p",text:"Administrator ialah pengguna yang mempunyai tanggungjawab mengurus sistem."},{type:"label",text:"Tugas:"},{type:"ul",items:["Mengurus data.","Mengurus pengguna.","Memantau transaksi.","Menyemak laporan.","Mengurus konfigurasi aplikasi."]},{type:"subheading",text:"B. APPROVER"},{type:"p",text:"Approver ialah pengguna yang bertanggungjawab menyemak dan membuat keputusan terhadap permohonan."},{type:"label",text:"Tugas:"},{type:"ul",items:["Menyemak permohonan.","Meluluskan permohonan.","Menolak permohonan.","Memberikan catatan atau ulasan."]},{type:"subheading",text:"C. STANDARD USER"},{type:"p",text:"Standard User ialah pengguna biasa yang menggunakan aplikasi untuk menjalankan urusan harian."},{type:"label",text:"Tugas:"},{type:"ul",items:["Mengisi borang.","Menghantar permohonan.","Melihat rekod berkaitan.","Menyemak status permohonan."]},{type:"p",text:"Pembahagian peranan ini boleh dilaksanakan menggunakan e-mel pengguna, jadual pengguna, formula dan konfigurasi keselamatan."}]},{id:"2.5",title:"2.5 PERBEZAAN APLIKASI STATIK DAN APLIKASI DINAMIK",blocks:[{type:"subheading",text:"A. APLIKASI STATIK"},{type:"p",text:"Aplikasi statik merujuk kepada aplikasi yang mempunyai fungsi terhad dan tidak banyak bertindak balas terhadap perubahan data atau keadaan tertentu."},{type:"label",text:"Contoh:"},{type:"ul",items:["Paparan senarai maklumat.","Direktori nombor telefon.","Paparan maklumat jabatan."]},{type:"subheading",text:"B. APLIKASI DINAMIK"},{type:"p",text:"Aplikasi dinamik mempunyai fungsi yang boleh berubah berdasarkan data, tindakan dan keadaan pengguna."},{type:"label",text:"Contoh:"},{type:"ul",items:["Paparan dashboard mengikut pengguna.","Status permohonan berubah selepas kelulusan.","Notifikasi apabila rekod baharu diterima.","Pengiraan baki stok secara automatik.","Paparan maklumat berdasarkan kategori."]},{type:"p",text:"AppSheet boleh digunakan untuk membangunkan aplikasi dinamik melalui Expression, Actions, Slices, Security Filters dan Automation."}]},{id:"2.6",title:"2.6 KELEBIHAN DAN BATASAN GOOGLE APPSHEET",blocks:[{type:"subheading",text:"KELEBIHAN"},{type:"ol",items:["Mempercepatkan pembangunan aplikasi.","Mengurangkan keperluan menulis kod pengaturcaraan.","Memudahkan pengurusan data.","Menyediakan fungsi automasi.","Menyokong pelbagai jenis peranti.","Sesuai untuk aplikasi pengurusan operasi organisasi.","Boleh disesuaikan mengikut keperluan pengguna."]},{type:"subheading",text:"BATASAN"},{type:"ol",items:["Fungsi tertentu bergantung pada pelan langganan.","Penggunaan sumber data yang besar boleh mempengaruhi prestasi.","Aplikasi yang kompleks memerlukan perancangan struktur data yang baik.","Fungsi tertentu memerlukan sambungan internet.","Integrasi dengan sistem luar mungkin memerlukan konfigurasi tambahan.","Pengurusan keselamatan perlu dilakukan dengan teliti.","AppSheet bukan pengganti kepada semua jenis pembangunan perisian tradisional."]},{type:"callout",variant:"note",title:"Nota",text:"Sebelum menggunakan aplikasi untuk operasi sebenar, pembangun perlu menyemak pelan, had penggunaan, ciri keselamatan dan syarat pelesenan terkini melalui dokumentasi rasmi AppSheet."}]},{id:"2.7",title:"2.7 CONTOH KAJIAN KES",blocks:[{type:"subheading",text:"KAJIAN KES: SISTEM PENGURUSAN TEMPAHAN BILIK"},{type:"p",text:"Sebuah institusi mempunyai beberapa bilik mesyuarat dan makmal komputer."},{type:"p",text:"Sebelum menggunakan sistem digital, tempahan dilakukan secara manual menggunakan borang dan rekod Excel."},{type:"label",text:"Masalah yang dihadapi:"},{type:"ol",items:["Pertindihan tempahan bilik.","Sukar menyemak status permohonan.","Rekod tempahan tidak tersusun.","Proses kelulusan mengambil masa.","Sukar menghasilkan laporan penggunaan bilik."]},{type:"label",text:"Penyelesaian:"},{type:"p",text:"Membangunkan aplikasi menggunakan Google AppSheet."},{type:"label",text:"Fungsi yang diperlukan:"},{type:"ol",items:["Pendaftaran pengguna.","Senarai bilik.","Borang tempahan.","Semakan kekosongan.","Kelulusan tempahan.","Notifikasi status.","Dashboard laporan."]},{type:"label",text:"HASIL YANG DIHARAPKAN:"},{type:"p",text:"Pengguna boleh membuat tempahan melalui telefon pintar, manakala pentadbir boleh mengurus dan meluluskan tempahan melalui aplikasi yang sama."}]},{id:"2.8",title:"2.8 LATIHAN PENGUKUHAN",blocks:[{type:"quiz_open",intro:"Jawab soalan berikut:",questions:[{q:"Apakah fungsi CRUD dalam AppSheet?",guide:"CRUD ialah empat operasi asas pengurusan data: Create (menambah rekod baharu), Read (melihat/membaca rekod), Update (mengemas kini rekod sedia ada), dan Delete (memadam rekod)."},{q:"Nyatakan lima jenis paparan yang boleh digunakan dalam AppSheet.",guide:"Mana-mana lima daripada: Table View, Deck View, Gallery View, Detail View, Form View, Chart View, Dashboard View, Calendar View, Map View."},{q:"Apakah perbezaan antara Actions dengan Automation?",guide:"Actions membolehkan pengguna melaksanakan operasi secara manual melalui butang atau tindakan dalam aplikasi (cth. Approve, Reject, Navigate), manakala Automation membolehkan sistem melaksanakan tindakan secara automatik apabila peristiwa (Event) atau syarat tertentu berlaku tanpa campur tangan manual."},{q:"Apakah fungsi Security Filter?",guide:"Security Filter berfungsi mengehadkan rekod yang dihantar dan dimuatkan kepada pengguna berdasarkan syarat tertentu untuk melindungi data."},{q:"Apakah peranan Google Sheets dalam ekosistem AppSheet?",guide:"Google Sheets berfungsi sebagai sumber data utama untuk menyimpan rekod, menyediakan struktur jadual, menyimpan maklumat pengguna dan transaksi serta membolehkan data disemak dan dikemas kini."},{q:"Apakah fungsi Google Docs dalam proses automasi?",guide:"Google Docs digunakan sebagai templat dokumen untuk menghasilkan dokumen secara automatik seperti surat kelulusan, surat pengesahan, borang tempahan dan laporan rasmi menggunakan data daripada aplikasi."},{q:"Mengapakah sistem memerlukan pembahagian peranan pengguna?",guide:"Untuk memastikan setiap kategori pengguna (Administrator, Approver, Standard User) hanya mengakses fungsi dan data yang berkaitan dengan tanggungjawab dan tugas mereka demi keselamatan dan kelancaran operasi."},{q:"Berikan tiga contoh penggunaan Automation.",guide:"Menghantar e-mel apabila permohonan diterima, menghantar notifikasi apabila stok mencapai tahap minimum, menghasilkan dokumen apabila tempahan diluluskan, atau menghantar peringatan tarikh tamat tempoh."},{q:"Apakah perbezaan aplikasi statik dengan aplikasi dinamik?",guide:"Aplikasi statik mempunyai fungsi terhad dan tidak banyak bertindak balas terhadap perubahan data (cth. direktori nombor telefon), manakala aplikasi dinamik boleh berubah mengikut data, tindakan dan keadaan pengguna melalui Expression, Actions, Slices, Security Filters dan Automation."},{q:"Nyatakan tiga batasan penggunaan Google AppSheet.",guide:"Antaranya: fungsi tertentu bergantung pada pelan langganan, sumber data yang besar boleh mempengaruhi prestasi, fungsi tertentu memerlukan sambungan internet, integrasi sistem luar perlukan konfigurasi tambahan, dan keselamatan perlu dikonfigurasi teliti."}]}]},{id:"2.9",title:"2.9 AKTIVITI AMALI",blocks:[{type:"subheading",text:"AKTIVITI: MERANCANG APLIKASI ORGANISASI"},{type:"label",text:"Arahan:"},{type:"ol",items:["Kenal pasti satu masalah pengurusan dalam organisasi.","Cadangkan satu aplikasi yang boleh dibangunkan menggunakan AppSheet.","Senaraikan pengguna yang akan menggunakan aplikasi.","Tentukan fungsi yang diperlukan.","Kenal pasti jenis data yang perlu disimpan.","Tentukan jenis paparan yang sesuai.","Kenal pasti proses yang boleh diautomasikan."]},{type:"label",text:"Contoh hasil aktiviti:"},{type:"p",text:"Nama Aplikasi: Sistem Pengurusan Aduan Kerosakan."},{type:"label",text:"Pengguna:"},{type:"ul",items:["Administrator.","Pegawai teknikal.","Pelapor."]},{type:"label",text:"Fungsi:"},{type:"ul",items:["Pendaftaran aduan.","Muat naik gambar kerosakan.","Penetapan pegawai bertugas.","Kemaskini status.","Rekod tindakan.","Laporan aduan."]}]},{id:"2.10",title:"2.10 RUMUSAN MODUL & RUJUKAN RASMI",blocks:[{type:"p",text:"Google AppSheet bukan sekadar platform untuk menghasilkan borang digital. Ia merupakan platform pembangunan aplikasi yang mempunyai fungsi pengurusan data, paparan maklumat, kawalan akses, tindakan pengguna dan automasi proses kerja."},{type:"p",text:"Pemahaman terhadap ekosistem AppSheet membolehkan pembangun merancang aplikasi dengan lebih sistematik sebelum memulakan proses pembangunan."},{type:"p",text:"Dalam modul seterusnya, peserta akan mempelajari cara menyediakan Google Sheets sebagai sumber data yang betul sebelum membina aplikasi pertama menggunakan AppSheet."},{type:"subheading",text:"RUJUKAN RASMI"},{type:"links",items:[{label:"1. Google AppSheet",url:"https://www.appsheet.com/"},{label:"2. AppSheet Help",url:"https://support.google.com/appsheet/"},{label:"3. AppSheet Documentation",url:"https://support.google.com/appsheet/topic/10102630"}]}]}]},ng={id:3,code:"MODUL 3",title:"Persediaan Pangkalan Data Menggunakan Google Sheets",shortTitle:"Pangkalan Data Sheets",subtitle:"Membina struktur jadual yang betul, 7 peraturan Google Sheets, 16 jenis data, Key & UNIQUEID(), Label, Ref dan projek FBMS_DATABASE.",pages:"Muka surat 15 – 30",duration:"60 minit",level:"Beginner",sections:[{id:"3.1",title:"3.1 OBJEKTIF PEMBELAJARAN",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Memahami konsep pangkalan data (Database).","Menjelaskan fungsi Google Sheets sebagai sumber data AppSheet.","Membina struktur jadual yang sesuai untuk aplikasi.","Memahami konsep Table, Column dan Row.","Mengenal pasti jenis data yang sesuai untuk setiap medan.","Memahami konsep Key dan Label.","Memahami hubungan antara jadual menggunakan Ref.","Membina pangkalan data asas untuk projek aplikasi."]}]},{id:"3.2",title:"3.2 APAKAH ITU DATABASE?",blocks:[{type:"p",text:"Database atau pangkalan data ialah tempat untuk menyimpan dan mengurus maklumat secara tersusun supaya maklumat tersebut mudah dicapai, dikemas kini dan digunakan."},{type:"label",text:"Contoh maklumat yang boleh disimpan:"},{type:"ul",items:["Maklumat pelajar.","Maklumat pekerja.","Rekod inventori.","Rekod tempahan.","Maklumat pelanggan.","Rekod transaksi."]},{type:"p",text:"Dalam Google AppSheet, pangkalan data boleh menggunakan Google Sheets sebagai sumber data."},{type:"p",text:"Contohnya, sebuah sistem pengurusan pelajar memerlukan maklumat seperti:"},{type:"ul",items:["ID Pelajar.","Nama Pelajar.","No. Kad Pengenalan.","Program.","Semester.","No. Telefon.","Alamat E-mel."]},{type:"p",text:"Maklumat ini disimpan dalam satu jadual yang tersusun."}]},{id:"3.3",title:"3.3 APAKAH GOOGLE SHEETS?",blocks:[{type:"p",text:"Google Sheets ialah aplikasi hamparan elektronik yang disediakan oleh Google untuk menghasilkan, menyimpan dan mengurus data."},{type:"p",text:"Google Sheets boleh digunakan sebagai sumber data bagi aplikasi AppSheet."},{type:"links",items:[{label:"Alamat laman web Google Sheets",url:"https://sheets.google.com/"}]},{type:"label",text:"Kelebihan Google Sheets:"},{type:"ol",items:["Boleh digunakan secara dalam talian.","Data boleh dikongsi dengan pengguna lain.","Menyokong pengurusan data dalam bentuk jadual.","Boleh disambungkan kepada Google AppSheet.","Menyokong formula dan fungsi pengiraan.","Memudahkan proses penyelenggaraan data."]}]},{id:"3.4",title:"3.4 MEMAHAMI STRUKTUR JADUAL",blocks:[{type:"p",text:"Sebelum membina database, peserta perlu memahami tiga komponen asas."},{type:"subheading",text:"A. TABLE (JADUAL)"},{type:"p",text:"Table ialah kumpulan data yang mempunyai struktur tertentu."},{type:"table",title:"Contoh — Jadual: STUDENTS",headers:["StudentID","StudentName","Programme","Semester"],rows:[["ST001","Ali","DIT","1"],["ST002","Siti","DIT","2"],["ST003","Ahmad","DKA","1"]]},{type:"subheading",text:"B. COLUMN (LAJUR)"},{type:"p",text:"Column ialah medan yang mewakili jenis maklumat tertentu dalam jadual."},{type:"label",text:"Contoh:"},{type:"ul",items:["StudentID.","StudentName.","Programme.","Semester."]},{type:"p",text:"Setiap Column perlu mempunyai nama yang jelas dan konsisten."},{type:"subheading",text:"C. ROW (BARIS)"},{type:"p",text:"Row ialah satu rekod lengkap dalam jadual."},{type:"p",text:"Contohnya, maklumat Ali dalam jadual STUDENTS merupakan satu Row."},{type:"label",text:"Kesimpulannya:"},{type:"ul",items:["Table = Jadual.","Column = Medan atau lajur.","Row = Rekod atau baris."]}]},{id:"3.5",title:"3.5 PERATURAN MEMBINA GOOGLE SHEETS UNTUK APPSHEET",blocks:[{type:"p",text:"Terdapat beberapa amalan yang perlu dipatuhi apabila menyediakan Google Sheets."},{type:"subheading",text:"PERATURAN 1: SETIAP JADUAL MESTI MEMPUNYAI HEADER"},{type:"p",text:"Baris pertama perlu mengandungi nama Column."},{type:"table",title:"Contoh yang betul:",headers:["StudentID","StudentName","Email","Phone"],rows:[]},{type:"callout",variant:"warning",title:"Contoh yang tidak sesuai",text:'Meletakkan tajuk besar "Maklumat Pelajar" pada baris pertama sebelum baris Header "ID | Nama | Emel | Telefon".'},{type:"subheading",text:"PERATURAN 2: ELAKKAN HEADER BERULANG"},{type:"p",text:"Jangan gunakan beberapa baris tajuk sebelum baris Header."},{type:"p",text:"AppSheet memerlukan struktur jadual yang konsisten."},{type:"subheading",text:"PERATURAN 3: ELAKKAN MERGE CELLS"},{type:"p",text:"Elakkan menggabungkan beberapa sel dalam kawasan jadual."},{type:"p",text:"Setiap Column dan Row perlu mempunyai struktur yang jelas."},{type:"subheading",text:"PERATURAN 4: SATU ROW UNTUK SATU REKOD"},{type:"p",text:"Setiap baris perlu mewakili satu rekod."},{type:"table",title:"Contoh:",headers:["ItemID","ItemName","Quantity"],rows:[["I001","Mouse","10"],["I002","Keyboard","5"],["I003","Monitor","8"]]},{type:"p",text:"Jangan masukkan beberapa item dalam satu baris jika setiap item perlu diuruskan sebagai rekod berasingan."},{type:"subheading",text:"PERATURAN 5: ELAKKAN BARIS KOSONG DALAM DATA"},{type:"p",text:"Pastikan jadual tidak mempunyai baris kosong yang memisahkan rekod secara tidak konsisten."},{type:"subheading",text:"PERATURAN 6: GUNAKAN NAMA COLUMN YANG KONSISTEN"},{type:"label",text:"Contoh nama yang disarankan:"},{type:"ul",items:["StudentID","StudentName","StudentEmail","StudentPhone","RegistrationDate"]},{type:"label",text:"Elakkan penggunaan nama yang tidak jelas seperti:"},{type:"ul",items:["Data1","Field2","Info","ColumnA"]},{type:"subheading",text:"PERATURAN 7: ELAKKAN PENGGUNAAN FORMULA YANG TIDAK DIPERLUKAN"},{type:"p",text:"Google Sheets boleh menggunakan formula, tetapi untuk aplikasi AppSheet, sesetengah pengiraan lebih sesuai dilakukan menggunakan AppSheet Expression."},{type:"label",text:"Contohnya:"},{type:"ul",items:["Mengira jumlah harga.","Menentukan status permohonan.","Mengira baki stok.","Menentukan kelayakan pengguna."]},{type:"p",text:"Pemilihan kaedah bergantung pada keperluan aplikasi."}]},{id:"3.6",title:"3.6 MEMAHAMI DATA TYPE",blocks:[{type:"p",text:"Data Type menentukan jenis maklumat yang disimpan dalam sesuatu Column."},{type:"p",text:"AppSheet menyediakan pelbagai jenis Data Type. Antara jenis yang penting ialah:"},{type:"subheading",text:"A. TEXT"},{type:"p",text:"Digunakan untuk menyimpan teks biasa."},{type:"label",text:"Contoh:"},{type:"ul",items:["Nama.","Alamat.","Keterangan.","Nama jabatan."]},{type:"subheading",text:"B. NUMBER"},{type:"p",text:"Digunakan untuk menyimpan nombor."},{type:"label",text:"Contoh:"},{type:"ul",items:["Kuantiti.","Bilangan pekerja.","Jumlah unit."]},{type:"subheading",text:"C. DECIMAL"},{type:"p",text:"Digunakan untuk menyimpan nombor perpuluhan."},{type:"label",text:"Contoh:"},{type:"ul",items:["Berat.","Ukuran.","Nilai perpuluhan."]},{type:"subheading",text:"D. PRICE"},{type:"p",text:"Digunakan untuk menyimpan nilai kewangan."},{type:"label",text:"Contoh:"},{type:"ul",items:["Harga barang.","Jumlah bayaran.","Kos pembelian."]},{type:"subheading",text:"E. DATE"},{type:"p",text:"Digunakan untuk menyimpan tarikh."},{type:"label",text:"Contoh:"},{type:"ul",items:["Tarikh pendaftaran.","Tarikh tempahan.","Tarikh pemeriksaan."]},{type:"subheading",text:"F. DATETIME"},{type:"p",text:"Digunakan untuk menyimpan tarikh berserta masa."},{type:"label",text:"Contoh:"},{type:"ul",items:["Tarikh dan masa transaksi.","Tarikh dan masa laporan dihantar."]},{type:"subheading",text:"G. TIME"},{type:"p",text:"Digunakan untuk menyimpan masa sahaja."},{type:"label",text:"Contoh:"},{type:"ul",items:["Masa mula mesyuarat.","Masa tamat tempahan."]},{type:"subheading",text:"H. EMAIL"},{type:"p",text:"Digunakan untuk menyimpan alamat e-mel."},{type:"label",text:"Contoh:"},{type:"ul",items:["admin@gmail.com","user@gmail.com"]},{type:"subheading",text:"I. PHONE"},{type:"p",text:"Digunakan untuk menyimpan nombor telefon."},{type:"subheading",text:"J. YES/NO"},{type:"p",text:"Digunakan untuk menyimpan pilihan benar atau salah."},{type:"label",text:"Contoh:"},{type:"ul",items:["Aktif atau tidak aktif.","Diluluskan atau tidak.","Sudah bayar atau belum."]},{type:"subheading",text:"K. ENUM"},{type:"p",text:"Digunakan untuk membolehkan pengguna memilih satu nilai daripada senarai pilihan."},{type:"label",text:"Contoh — Status:"},{type:"ul",items:["Pending.","Approved.","Rejected."]},{type:"subheading",text:"L. ENUMLIST"},{type:"p",text:"Digunakan untuk membolehkan pengguna memilih lebih daripada satu nilai."},{type:"label",text:"Contoh — Kemudahan:"},{type:"ul",items:["Projektor.","Komputer.","Sistem Audio."]},{type:"subheading",text:"M. IMAGE"},{type:"p",text:"Digunakan untuk menyimpan rujukan gambar dalam aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Gambar produk.","Gambar kerosakan.","Gambar aset."]},{type:"subheading",text:"N. FILE"},{type:"p",text:"Digunakan untuk melampirkan fail."},{type:"label",text:"Contoh:"},{type:"ul",items:["Dokumen PDF.","Surat permohonan.","Dokumen sokongan."]},{type:"subheading",text:"O. SIGNATURE"},{type:"p",text:"Digunakan untuk merekod tandatangan digital."},{type:"subheading",text:"P. LOCATION"},{type:"p",text:"Digunakan untuk merekod maklumat lokasi."}]},{id:"3.7",title:"3.7 MEMAHAMI KEY DALAM APPSHEET",blocks:[{type:"p",text:"Key ialah Column yang digunakan untuk mengenal pasti setiap rekod secara unik dalam sesuatu jadual."},{type:"p",text:"Setiap rekod perlu mempunyai nilai Key yang berbeza."},{type:"table",title:"Contoh:",headers:["StudentID","StudentName"],rows:[["ST001","Ali"],["ST002","Siti"],["ST003","Ahmad"]]},{type:"p",text:"Dalam contoh ini, StudentID boleh digunakan sebagai Key."},{type:"label",text:"Mengapa Key penting?"},{type:"ol",items:["Mengenal pasti rekod secara unik.","Mengelakkan kekeliruan antara rekod.","Membolehkan hubungan antara jadual.","Membolehkan rekod dikemas kini dengan tepat.","Membantu AppSheet mengurus data."]},{type:"subheading",text:"Apakah UNIQUEID()?"},{type:"p",text:"UNIQUEID() ialah fungsi AppSheet yang boleh digunakan untuk menghasilkan pengecam unik bagi sesuatu rekod."},{type:"code",title:"Contoh: Column StudentID → Initial Value",code:"UNIQUEID()"},{type:"p",text:"Apabila pengguna menambah rekod baharu, sistem akan menjana ID unik secara automatik."},{type:"callout",variant:"important",title:"PENTING",items:["Key mestilah unik.","Key tidak boleh kosong.","Key sebaik-baiknya tidak berubah selepas rekod diwujudkan.","Jangan gunakan nama individu sebagai Key kerana nama mungkin berulang atau berubah."]}]},{id:"3.8",title:"3.8 MEMAHAMI LABEL",blocks:[{type:"p",text:"Label ialah Column yang digunakan untuk mewakili sesuatu rekod dalam paparan aplikasi."},{type:"table",title:"Contoh:",headers:["StudentID","StudentName"],rows:[["ST001","Ali"],["ST002","Siti"]]},{type:"p",text:"StudentID digunakan sebagai Key. StudentName digunakan sebagai Label."},{type:"p",text:"Apabila pengguna memilih rekod pelajar dalam aplikasi, nama pelajar boleh dipaparkan berbanding ID sahaja."},{type:"callout",variant:"note",title:"Perbezaan",items:["Key = Pengenalan unik rekod.","Label = Nama atau maklumat yang mewakili rekod dalam paparan pengguna."]}]},{id:"3.9",title:"3.9 MEMAHAMI REF (RELATIONSHIP ANTARA JADUAL)",blocks:[{type:"p",text:"Ref ialah jenis Column dalam AppSheet yang digunakan untuk menghubungkan satu jadual dengan jadual yang lain."},{type:"p",text:"Contoh: Kita mempunyai dua jadual:"},{type:"table",title:"TABLE 1: CUSTOMERS",headers:["CustomerID","CustomerName"],rows:[["C001","Ali"],["C002","Siti"]]},{type:"table",title:"TABLE 2: ORDERS",headers:["OrderID","OrderDate","CustomerID"],rows:[["O001","10/11/2026","C001"],["O002","11/11/2026","C002"]]},{type:"label",text:"Dalam contoh ini:"},{type:"ul",items:["CustomerID dalam CUSTOMERS ialah Key.","CustomerID dalam ORDERS menjadi Ref kepada jadual CUSTOMERS."]},{type:"p",text:"Ini membolehkan setiap pesanan dikaitkan dengan pelanggan yang betul."},{type:"subheading",text:"JENIS HUBUNGAN DATA"},{type:"label",text:"A. ONE-TO-ONE (1:1)"},{type:"p",text:"Satu rekod dalam jadual pertama mempunyai satu rekod berkaitan dalam jadual kedua."},{type:"ul",items:["Contoh: Seorang pekerja mempunyai satu profil khusus."]},{type:"label",text:"B. ONE-TO-MANY (1:M)"},{type:"p",text:"Satu rekod dalam jadual pertama boleh mempunyai banyak rekod dalam jadual kedua."},{type:"ul",items:["Contoh: Seorang pelanggan boleh membuat banyak pesanan."]},{type:"label",text:"C. MANY-TO-MANY (M:M)"},{type:"p",text:"Banyak rekod dalam jadual pertama boleh mempunyai banyak hubungan dengan rekod dalam jadual kedua."},{type:"ul",items:["Contoh: Seorang pelajar boleh mengikuti banyak kursus.","Satu kursus boleh mempunyai ramai pelajar."]},{type:"p",text:"Hubungan seperti ini biasanya memerlukan satu jadual penghubung (Junction Table)."},{type:"label",text:"Contoh:"},{type:"ul",items:["STUDENTS","COURSES","STUDENT_COURSES"]}]},{id:"3.10",title:"3.10 PROJEK AMALI: MEMBINA DATABASE SISTEM TEMPAHAN BILIK",blocks:[{type:"p",text:"Dalam kursus ini, peserta akan menggunakan satu projek utama iaitu:"},{type:"label",text:"FACILITY BOOKING MANAGEMENT SYSTEM (FBMS)."},{type:"p",text:"Sebelum membina aplikasi, peserta perlu menyediakan database. Database ini akan mempunyai empat jadual utama."},{type:"subheading",text:"TABLE 1: USERS"},{type:"p",text:"Tujuan: Menyimpan maklumat pengguna sistem."},{type:"table",title:"Struktur & Cadangan Data Type — USERS",headers:["No.","Column","Cadangan Data Type"],rows:[["1","UserID","Text (Key)"],["2","UserName","Name"],["3","Email","Email"],["4","Phone","Phone"],["5","UserRole","Enum"],["6","Department","Text"],["7","IsActive","Yes/No"]]},{type:"subheading",text:"TABLE 2: ROOMS"},{type:"p",text:"Tujuan: Menyimpan maklumat bilik dan kemudahan."},{type:"table",title:"Struktur & Cadangan Data Type — ROOMS",headers:["No.","Column","Cadangan Data Type"],rows:[["1","RoomID","Text (Key)"],["2","RoomName","Text (Label)"],["3","RoomLocation","Text"],["4","Capacity","Number"],["5","Facilities","EnumList"],["6","RoomStatus","Enum"]]},{type:"subheading",text:"TABLE 3: BOOKINGS"},{type:"p",text:"Tujuan: Menyimpan rekod tempahan bilik."},{type:"table",title:"Struktur & Cadangan Data Type — BOOKINGS",headers:["No.","Column","Cadangan Data Type"],rows:[["1","BookingID","Text (Key)"],["2","UserID","Ref kepada USERS"],["3","RoomID","Ref kepada ROOMS"],["4","BookingDate","Date"],["5","StartTime","Time"],["6","EndTime","Time"],["7","Purpose","LongText"],["8","BookingStatus","Enum"],["9","CreatedAt","DateTime"]]},{type:"subheading",text:"TABLE 4: APPROVALS"},{type:"p",text:"Tujuan: Menyimpan rekod kelulusan tempahan."},{type:"table",title:"Struktur & Cadangan Data Type — APPROVALS",headers:["No.","Column","Cadangan Data Type"],rows:[["1","ApprovalID","Text (Key)"],["2","BookingID","Ref kepada BOOKINGS"],["3","ApproverEmail","Email"],["4","ApprovalDate","DateTime"],["5","ApprovalStatus","Enum"],["6","Remarks","LongText"]]}]},{id:"3.11",title:"3.11 LANGKAH MEMBINA DATABASE DALAM GOOGLE SHEETS",blocks:[{type:"p",text:"Ikuti langkah berikut:"},{type:"ol",items:["LANGKAH 1: Buka Google Sheets (https://sheets.google.com/).","LANGKAH 2: Klik Blank Spreadsheet untuk menghasilkan fail baharu.","LANGKAH 3: Namakan fail: FBMS_DATABASE","LANGKAH 4: Tukarkan nama Sheet1 kepada USERS.","LANGKAH 5: Masukkan nama Column seperti yang disenaraikan dalam bahagian 3.10.","LANGKAH 6: Tambahkan Sheet baharu dan namakan: ROOMS","LANGKAH 7: Masukkan Column yang telah ditetapkan untuk jadual ROOMS.",{text:"LANGKAH 8: Ulang proses untuk menghasilkan jadual:",subitems:["BOOKINGS","APPROVALS"]},"LANGKAH 9: Masukkan beberapa rekod contoh bagi setiap jadual.","LANGKAH 10: Pastikan semua nama Sheet dan Column adalah betul.","LANGKAH 11: Pastikan fail disimpan dalam Google Drive."]},{type:"callout",variant:"important",title:"PENTING",text:"Pastikan setiap jadual mempunyai Header pada baris pertama. Jangan gabungkan sel dan jangan letakkan tajuk tambahan di atas Header."}]},{id:"3.12",title:"3.12 LATIHAN PENGUKUHAN",blocks:[{type:"quiz_open",intro:"Jawab soalan berikut:",questions:[{q:"Apakah maksud Database?",guide:"Database atau pangkalan data ialah tempat untuk menyimpan dan mengurus maklumat secara tersusun supaya mudah dicapai, dikemas kini dan digunakan."},{q:"Apakah perbezaan antara Table, Column dan Row?",guide:"Table = jadual (kumpulan data berstruktur), Column = medan/lajur (jenis maklumat tertentu), dan Row = baris (satu rekod lengkap dalam jadual)."},{q:"Mengapakah Header penting dalam Google Sheets?",guide:"Header pada baris pertama mengenal pasti nama setiap Column supaya AppSheet dapat membaca dan membina struktur jadual aplikasi secara konsisten."},{q:"Apakah fungsi Data Type?",guide:"Data Type menentukan jenis maklumat yang boleh disimpan, dipaparkan dan diproses dalam sesuatu Column (cth. Text, Number, Date, Email, Enum, Ref)."},{q:"Apakah perbezaan antara Text dengan Number?",guide:"Text digunakan untuk menyimpan teks biasa seperti nama dan alamat, manakala Number digunakan untuk menyimpan nombor bagi kuantiti, bilangan atau pengiraan."},{q:"Apakah fungsi Key?",guide:"Key ialah Column yang mengenal pasti setiap rekod secara unik dalam jadual untuk mengelakkan kekeliruan, membolehkan kemas kini tepat serta membolehkan hubungan antara jadual."},{q:"Mengapakah UNIQUEID() digunakan?",guide:"UNIQUEID() digunakan dalam Initial Value pada Column Key bagi menjana pengecam unik secara automatik setiap kali rekod baharu ditambah."},{q:"Apakah perbezaan antara Key dengan Label?",guide:"Key ialah pengenalan unik rekod (biasanya ID), manakala Label ialah nama atau maklumat mesra pengguna yang mewakili rekod tersebut dalam paparan aplikasi."},{q:"Apakah fungsi Ref?",guide:"Ref ialah jenis Column yang menghubungkan satu jadual dengan jadual yang lain berdasarkan Key jadual rujukan."},{q:"Apakah perbezaan hubungan One-to-One dengan One-to-Many?",guide:"One-to-One (1:1) bermaksud satu rekod jadual pertama mempunyai satu rekod berkaitan di jadual kedua, manakala One-to-Many (1:M) bermaksud satu rekod jadual pertama boleh mempunyai banyak rekod di jadual kedua."},{q:"Mengapakah hubungan antara jadual penting dalam pembangunan aplikasi?",guide:"Untuk mengelakkan pertindihan data, memastikan integriti rekod, membolehkan pautan automatik antara rekod berkaitan (cth. pesanan kepada pelanggan) dan memudahkan pengurusan serta pelaporan."},{q:"Apakah fungsi Junction Table dalam hubungan Many-to-Many?",guide:"Junction Table (jadual penghubung seperti STUDENT_COURSES) menghubungkan dua jadual yang mempunyai hubungan banyak-ke-banyak supaya setiap pasangan hubungan dapat direkod dengan teratur."}]}]},{id:"3.13",title:"3.13 AKTIVITI AMALI",blocks:[{type:"subheading",text:"TAJUK: MEMBINA DATABASE SISTEM TEMPAHAN BILIK"},{type:"label",text:"Arahan:"},{type:"ol",items:["Bina satu Google Spreadsheet baharu.","Namakan fail FBMS_DATABASE.",{text:"Sediakan empat jadual:",subitems:["USERS","ROOMS","BOOKINGS","APPROVALS"]},"Masukkan semua Column yang telah ditetapkan.","Kenal pasti Key bagi setiap jadual.","Kenal pasti Column yang akan menggunakan Ref.",{text:"Masukkan sekurang-kurangnya:",subitems:["3 rekod pengguna.","3 rekod bilik.","3 rekod tempahan.","2 rekod kelulusan."]},"Semak struktur database sebelum digunakan dalam AppSheet."]},{type:"label",text:"HASIL YANG PERLU DIHANTAR:"},{type:"ul",items:["Fail Google Sheets.","Empat jadual yang lengkap.","Rekod contoh.","Senarai Key dan Ref bagi setiap jadual."]}]},{id:"3.14",title:"3.14 RUMUSAN MODUL & RUJUKAN RASMI",blocks:[{type:"p",text:"Google Sheets boleh digunakan sebagai sumber data untuk membina aplikasi menggunakan AppSheet."},{type:"p",text:"Pembangun perlu memahami struktur jadual, jenis data, Key, Label dan hubungan antara jadual sebelum memulakan pembangunan aplikasi."},{type:"p",text:"Struktur database yang baik akan memudahkan proses pembangunan aplikasi, pengurusan data, penghasilan laporan dan pelaksanaan automasi."},{type:"p",text:"Dalam modul seterusnya, peserta akan mula menggunakan database yang telah dibina untuk menghasilkan aplikasi pertama menggunakan Google AppSheet."},{type:"subheading",text:"RUJUKAN RASMI"},{type:"links",items:[{label:"1. Google Sheets",url:"https://sheets.google.com/"},{label:"2. Google AppSheet",url:"https://www.appsheet.com/"},{label:"3. AppSheet Help",url:"https://support.google.com/appsheet/"},{label:"4. AppSheet Data Documentation",url:"https://support.google.com/appsheet/topic/10102630"}]}]}]},rg={id:4,code:"MODUL 4",title:"Membina Aplikasi Pertama Menggunakan Google AppSheet",shortTitle:"Bina Aplikasi Pertama",subtitle:"Panduan lengkap langkah demi langkah membina aplikasi FBMS dari Google Sheets, menyemak Table, menetapkan UNIQUEID(), Ref, Preview, Save dan menyelesaikan 5 masalah lazim.",pages:"Muka surat 31 – 44",duration:"60 minit",level:"Beginner",sections:[{id:"4.1",title:"4.1 OBJEKTIF PEMBELAJARAN",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Mengakses platform Google AppSheet.","Membina aplikasi baharu menggunakan Google Sheets.","Menyambungkan sumber data kepada AppSheet.","Memahami proses penjanaan aplikasi secara automatik.","Mengenali struktur asas AppSheet Editor.","Mengurus jadual dan Column dalam aplikasi.","Membuat perubahan pada aplikasi.","Menguji aplikasi menggunakan fungsi Preview.","Menyimpan dan mengakses aplikasi yang telah dibangunkan."]}]},{id:"4.2",title:"4.2 PENGENALAN KEPADA APPSHEET EDITOR",blocks:[{type:"p",text:"AppSheet Editor ialah persekitaran pembangunan aplikasi yang membolehkan pengguna mengkonfigurasi dan mengurus aplikasi."},{type:"label",text:"Melalui editor ini, pembangun boleh:"},{type:"ul",items:["Menambah sumber data.","Mengurus jadual.","Mengubah jenis data.","Menghasilkan paparan aplikasi.","Mengurus borang.","Membina tindakan.","Mengkonfigurasi automasi.","Menetapkan keselamatan aplikasi.","Menguji aplikasi."]},{type:"links",items:[{label:"Untuk mengakses AppSheet, layari",url:"https://www.appsheet.com/"}]},{type:"p",text:"Log masuk menggunakan akaun Google yang mempunyai akses kepada Google Sheets yang ingin digunakan."}]},{id:"4.3",title:"4.3 KAEDAH MEMBINA APLIKASI DALAM APPSHEET",blocks:[{type:"p",text:"Terdapat beberapa pendekatan untuk memulakan pembangunan aplikasi."},{type:"subheading",text:"A. START WITH EXISTING DATA"},{type:"p",text:"Kaedah ini membolehkan pengguna membina aplikasi berdasarkan sumber data yang telah tersedia."},{type:"label",text:"Contoh:"},{type:"ul",items:["Google Sheets.","Microsoft Excel.","Sumber data lain yang disokong."]},{type:"p",text:"Kaedah ini sesuai digunakan apabila pengguna telah menyediakan database terlebih dahulu."},{type:"subheading",text:"B. START WITH A TEMPLATE"},{type:"p",text:"Pengguna boleh menggunakan templat aplikasi yang telah disediakan sebagai asas pembangunan."},{type:"p",text:"Templat boleh membantu pengguna memahami struktur dan fungsi aplikasi."},{type:"subheading",text:"C. START WITH AN IDEA"},{type:"p",text:"Pengguna boleh menerangkan idea aplikasi yang ingin dibina dan menggunakan bantuan AI AppSheet untuk membantu menghasilkan struktur awal aplikasi."},{type:"p",text:"Ketersediaan dan paparan pilihan ini mungkin berubah mengikut versi editor serta akaun pengguna."}]},{id:"4.4",title:"4.4 PROJEK AMALI: MEMBINA APLIKASI FBMS",blocks:[{type:"label",text:"Nama projek:"},{type:"p",text:"FACILITY BOOKING MANAGEMENT SYSTEM"},{type:"label",text:"Tujuan:"},{type:"p",text:"Membangunkan aplikasi untuk mengurus tempahan bilik dan kemudahan organisasi."},{type:"label",text:"Database yang digunakan:"},{type:"code",code:"FBMS_DATABASE"},{type:"label",text:"Jadual yang telah disediakan:"},{type:"ol",items:["USERS","ROOMS","BOOKINGS","APPROVALS"]}]},{id:"4.5",title:"4.5 LANGKAH 1: AKSES GOOGLE APPSHEET",blocks:[{type:"ol",items:["Buka pelayar web.","Layari https://www.appsheet.com/","Klik Sign In jika belum log masuk.","Pilih akaun Google.","Berikan kebenaran akses yang diperlukan.","Pastikan pengguna berjaya memasuki AppSheet."]},{type:"callout",variant:"note",title:"Peringatan",text:"Pastikan akaun Google yang digunakan mempunyai akses kepada fail FBMS_DATABASE."}]},{id:"4.6",title:"4.6 LANGKAH 2: MEMBINA APLIKASI BAHARU",blocks:[{type:"ol",items:["Pada halaman utama AppSheet, cari pilihan untuk menghasilkan aplikasi baharu.","Pilih Create atau pilihan New App yang tersedia.","Pilih kaedah Start with existing data.","Berikan nama aplikasi: FBMS - FACILITY BOOKING MANAGEMENT SYSTEM","Pilih kategori yang sesuai jika diminta.","Pilih sumber data Google Sheets.","Cari fail FBMS_DATABASE dalam Google Drive.","Pilih fail tersebut.","Teruskan proses penciptaan aplikasi."]},{type:"p",text:"AppSheet akan membaca struktur data dan cuba menghasilkan aplikasi secara automatik."},{type:"callout",variant:"note",title:"Nota",text:"Nama butang dan susunan menu mungkin berbeza mengikut versi AppSheet Editor."}]},{id:"4.7",title:"4.7 LANGKAH 3: MEMAHAMI PROSES AUTO-GENERATION",blocks:[{type:"p",text:"Apabila sumber data berjaya disambungkan, AppSheet akan menganalisis struktur jadual."},{type:"label",text:"Sistem akan cuba mengenal pasti:"},{type:"ul",items:["Nama jadual.","Nama Column.","Jenis data.","Key.","Label.","Struktur hubungan data.","Paparan asas aplikasi."]},{type:"p",text:"Berdasarkan struktur tersebut, AppSheet akan menghasilkan aplikasi awal."},{type:"callout",variant:"important",title:"PENTING",text:"Auto-generation tidak bermaksud aplikasi telah siap sepenuhnya. Pembangun masih perlu menyemak dan membetulkan konfigurasi yang dijana secara automatik."},{type:"label",text:"Antara perkara yang perlu diperiksa:"},{type:"ol",items:["Key setiap jadual.","Label setiap jadual.","Data Type.","Hubungan Ref.","Susunan paparan.","Borang kemasukan data.","Kebenaran pengguna."]}]},{id:"4.8",title:"4.8 LANGKAH 4: MEMAHAMI APPSHEET EDITOR",blocks:[{type:"p",text:"AppSheet Editor mempunyai beberapa bahagian utama untuk mengurus aplikasi."},{type:"subheading",text:"A. DATA"},{type:"p",text:"Bahagian Data digunakan untuk mengurus sumber data dan struktur jadual."},{type:"label",text:"Fungsi utama:"},{type:"ul",items:["Melihat senarai jadual.","Menambah jadual.","Mengurus Column.","Menentukan Data Type.","Menetapkan Key.","Menetapkan Label.","Mengurus hubungan Ref.","Menetapkan konfigurasi data."]},{type:"subheading",text:"B. APP"},{type:"p",text:"Bahagian ini digunakan untuk mengurus reka bentuk dan paparan aplikasi."},{type:"label",text:"Antara perkara yang boleh dikonfigurasikan:"},{type:"ul",items:["Views.","Navigation.","Dashboard.","Paparan utama.","Susunan menu.","Konfigurasi paparan pengguna."]},{type:"subheading",text:"C. ACTIONS"},{type:"p",text:"Bahagian Actions digunakan untuk menghasilkan tindakan yang boleh dilakukan oleh pengguna."},{type:"label",text:"Contoh:"},{type:"ul",items:["Meluluskan tempahan.","Menolak permohonan.","Membuka paparan tertentu.","Mengemas kini status rekod."]},{type:"subheading",text:"D. AUTOMATION"},{type:"p",text:"Bahagian Automation digunakan untuk membina proses automatik."},{type:"label",text:"Contoh:"},{type:"ul",items:["Menghantar e-mel.","Menghasilkan dokumen.","Menghantar pemberitahuan.","Melaksanakan proses apabila rekod baharu dimasukkan."]},{type:"subheading",text:"E. SECURITY"},{type:"p",text:"Bahagian Security digunakan untuk mengurus keselamatan aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Pengesahan pengguna.","Keperluan log masuk.","Kawalan akses.","Security Filters."]},{type:"subheading",text:"F. SETTINGS"},{type:"p",text:"Bahagian Settings digunakan untuk mengurus konfigurasi aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Nama aplikasi.","Penerangan aplikasi.","Identiti visual.","Konfigurasi paparan.","Tetapan penggunaan."]},{type:"subheading",text:"G. INTELLIGENCE"},{type:"p",text:"Bahagian Intelligence menyediakan fungsi berkaitan pemprosesan maklumat dan keupayaan pintar yang disokong oleh AppSheet. Fungsi yang tersedia bergantung pada ciri dan pelan penggunaan."},{type:"callout",variant:"note",title:"Nota",text:"Susunan menu dan nama seksyen mungkin berubah mengikut kemas kini platform."}]},{id:"4.9",title:"4.9 LANGKAH 5: MENYEMAK TABLE",blocks:[{type:"p",text:"Selepas aplikasi berjaya dijana:"},{type:"ol",items:["Buka bahagian Data.","Pilih jadual USERS.","Semak semua Column.","Pastikan nama Column adalah betul.","Semak Data Type.","Pastikan UserID ditetapkan sebagai Key.","Tetapkan UserName sebagai Label.","Ulang proses bagi jadual ROOMS.","Ulang proses bagi jadual BOOKINGS.","Ulang proses bagi jadual APPROVALS."]},{type:"table",title:"Contoh konfigurasi — TABLE: USERS",headers:["Column","Data Type","Tetapan"],rows:[["UserID","Text","Key"],["UserName","Name","Label"],["Email","Email","-"],["Phone","Phone","-"],["UserRole","Enum","-"],["Department","Text","-"],["IsActive","Yes/No","-"]]},{type:"p",text:"Pastikan tetapan Key dan Label dibuat dengan betul."}]},{id:"4.10",title:"4.10 LANGKAH 6: MENETAPKAN UNIQUEID()",blocks:[{type:"p",text:"Untuk memastikan setiap rekod mempunyai pengecam unik, gunakan fungsi UNIQUEID()."},{type:"code",title:"Contoh: Jadual USERS → Column UserID",code:`Type: Text
Key: ON
Initial Value: UNIQUEID()`},{type:"label",text:"Langkah:"},{type:"ol",items:["Buka Data.","Pilih USERS.","Pilih Column UserID.","Pastikan Type ialah Text.","Aktifkan pilihan Key.","Masukkan UNIQUEID() dalam ruangan Initial Value.","Simpan konfigurasi."]},{type:"label",text:"Ulang proses untuk:"},{type:"ul",items:["RoomID.","BookingID.","ApprovalID."]},{type:"callout",variant:"important",title:"PENTING",text:"Jika database telah mempunyai rekod sedia ada, pastikan semua rekod tersebut mempunyai nilai Key yang unik sebelum mengaktifkan konfigurasi ini. Initial Value digunakan untuk menjana nilai apabila rekod baharu diwujudkan. Ia bukan fungsi yang secara automatik membetulkan semua rekod lama."}]},{id:"4.11",title:"4.11 LANGKAH 7: MENETAPKAN REF",blocks:[{type:"p",text:"Sekarang kita akan menghubungkan jadual."},{type:"subheading",text:"A. REF USERID"},{type:"ol",items:["Buka jadual BOOKINGS.","Cari Column UserID.","Tukar Data Type kepada Ref.","Pilih jadual rujukan USERS.","Simpan konfigurasi."]},{type:"subheading",text:"B. REF ROOMID"},{type:"ol",items:["Buka jadual BOOKINGS.","Cari Column RoomID.","Tukar Data Type kepada Ref.","Pilih jadual rujukan ROOMS.","Simpan konfigurasi."]},{type:"subheading",text:"C. REF BOOKINGID"},{type:"ol",items:["Buka jadual APPROVALS.","Cari Column BookingID.","Tukar Data Type kepada Ref.","Pilih jadual rujukan BOOKINGS.","Simpan konfigurasi."]},{type:"p",text:"Selepas hubungan ini ditetapkan, AppSheet boleh menghubungkan rekod antara jadual berdasarkan Key yang digunakan."}]},{id:"4.12",title:"4.12 LANGKAH 8: MENGUJI APLIKASI MELALUI PREVIEW",blocks:[{type:"p",text:"AppSheet menyediakan fungsi Preview untuk membolehkan pembangun melihat paparan aplikasi semasa proses pembangunan."},{type:"label",text:"Langkah:"},{type:"ol",items:["Cari bahagian Preview dalam AppSheet Editor.","Pilih paparan telefon jika diperlukan.","Perhatikan paparan utama aplikasi.","Cuba membuka senarai USERS.","Cuba membuka senarai ROOMS.","Cuba melihat rekod BOOKINGS.","Cuba membuka borang baharu.","Periksa sama ada maklumat dipaparkan dengan betul."]},{type:"label",text:"Perkara yang perlu diperiksa:"},{type:"ul",items:["Adakah nama jadual dipaparkan?","Adakah rekod berjaya dipaparkan?","Adakah borang berfungsi?","Adakah pilihan Ref menunjukkan maklumat yang betul?","Adakah paparan sesuai digunakan pada telefon?"]},{type:"callout",variant:"important",title:"PENTING",text:"Preview digunakan untuk menguji pengalaman pengguna. Ia tidak menggantikan ujian keselamatan, penyegerakan data dan ujian aplikasi sebenar."}]},{id:"4.13",title:"4.13 LANGKAH 9: MENYIMPAN PERUBAHAN",blocks:[{type:"p",text:"Selepas membuat perubahan pada konfigurasi aplikasi:"},{type:"ol",items:["Semak semula perubahan.","Klik Save jika diperlukan.","Tunggu proses penyimpanan selesai.","Semak mesej ralat atau amaran.","Pastikan aplikasi tidak mempunyai konfigurasi kritikal yang belum diselesaikan."]},{type:"p",text:"AppSheet lazimnya menyediakan fungsi penyimpanan perubahan melalui editor."},{type:"callout",variant:"warning",title:"Peringatan",text:"Jangan anggap aplikasi telah sedia digunakan hanya kerana perubahan berjaya disimpan."}]},{id:"4.14",title:"4.14 LANGKAH 10: UJIAN KEMASUKAN DATA",blocks:[{type:"p",text:"Sekarang kita akan menguji fungsi kemasukan data."},{type:"subheading",text:"Ujian pertama: USERS"},{type:"ol",items:["Buka paparan USERS.","Pilih butang tambah rekod.","Masukkan nama pengguna.","Masukkan alamat e-mel.","Masukkan nombor telefon.","Pilih UserRole.","Masukkan Department.","Tetapkan status aktif.","Simpan rekod."]},{type:"subheading",text:"Ujian kedua: ROOMS"},{type:"ol",items:["Buka paparan ROOMS.","Tambah rekod baharu.","Masukkan nama bilik.","Masukkan lokasi.","Masukkan kapasiti.","Pilih kemudahan.","Tetapkan status bilik.","Simpan rekod."]},{type:"subheading",text:"Ujian ketiga: BOOKINGS"},{type:"ol",items:["Buka paparan BOOKINGS.","Tambah rekod baharu.","Pilih pengguna.","Pilih bilik.","Pilih tarikh tempahan.","Masukkan masa mula.","Masukkan masa tamat.","Masukkan tujuan tempahan.","Simpan rekod."]},{type:"p",text:"Pastikan pilihan UserID dan RoomID memaparkan rekod daripada jadual USERS dan ROOMS."}]},{id:"4.15",title:"4.15 MASALAH LAZIM SEMASA MEMBINA APLIKASI",blocks:[{type:"subheading",text:"MASALAH 1: DATA TIDAK DIPAPARKAN"},{type:"label",text:"Kemungkinan punca:"},{type:"ul",items:["Jadual belum disambungkan.","Nama Sheet tidak betul.","Struktur Header tidak konsisten.","Pengguna tiada akses kepada sumber data."]},{type:"p",text:"Penyelesaian: Semak sumber data dan konfigurasi jadual."},{type:"subheading",text:"MASALAH 2: KEY TIDAK DIKENAL PASTI"},{type:"label",text:"Kemungkinan punca:"},{type:"ul",items:["Tiada Column yang unik.","Terdapat nilai Key berulang.","Terdapat nilai Key kosong."]},{type:"p",text:"Penyelesaian: Gunakan Column yang mempunyai nilai unik dan pastikan semua rekod mempunyai Key."},{type:"subheading",text:"MASALAH 3: REF TIDAK BERFUNGSI"},{type:"label",text:"Kemungkinan punca:"},{type:"ul",items:["Column Ref menggunakan jenis data yang salah.","Jadual rujukan tidak betul.","Nilai Ref tidak sepadan dengan Key jadual induk."]},{type:"p",text:"Penyelesaian: Semak jenis data dan jadual rujukan."},{type:"subheading",text:"MASALAH 4: APLIKASI TIDAK BERJAYA DI-SAVE"},{type:"label",text:"Kemungkinan punca:"},{type:"ul",items:["Terdapat konfigurasi yang tidak lengkap.","Terdapat masalah sambungan.","Terdapat ralat dalam Expression."]},{type:"p",text:"Penyelesaian: Semak mesej ralat yang dipaparkan oleh AppSheet Editor dan baiki konfigurasi berkaitan."},{type:"subheading",text:"MASALAH 5: DATA TIDAK DIKEMAS KINI"},{type:"label",text:"Kemungkinan punca:"},{type:"ul",items:["Data belum disegerakkan.","Pengguna tidak mempunyai kebenaran mengemas kini.","Konfigurasi Column tidak membenarkan perubahan."]},{type:"p",text:"Penyelesaian: Semak tetapan kemasukan data dan jalankan proses Sync."}]},{id:"4.16",title:"4.16 LATIHAN PENGUKUHAN",blocks:[{type:"quiz_open",intro:"Jawab soalan berikut:",questions:[{q:"Apakah fungsi AppSheet Editor?",guide:"AppSheet Editor ialah persekitaran pembangunan aplikasi untuk mengkonfigurasi dan mengurus sumber data, jadual, jenis data, paparan, borang, tindakan, automasi, keselamatan dan pengujian aplikasi."},{q:"Apakah perbezaan Start with Existing Data dengan Start with a Template?",guide:"Start with Existing Data membina aplikasi daripada sumber data sedia ada (cth. Google Sheets/Excel yang telah dibina), manakala Start with a Template menggunakan templat aplikasi sedia ada sebagai asas pembangunan."},{q:"Apakah fungsi bahagian Data?",guide:"Mengurus sumber data dan struktur jadual termasuk melihat/menambah jadual, mengurus Column, menentukan Data Type, menetapkan Key, Label, Ref dan konfigurasi data."},{q:"Apakah fungsi bahagian Actions?",guide:"Menghasilkan tindakan yang boleh dilakukan oleh pengguna dalam aplikasi seperti meluluskan tempahan, menolak permohonan, membuka paparan tertentu dan mengemas kini status rekod."},{q:"Apakah fungsi bahagian Automation?",guide:"Membina proses automatik seperti menghantar e-mel, menghasilkan dokumen, menghantar pemberitahuan dan melaksanakan proses apabila rekod baharu dimasukkan."},{q:"Mengapakah kita perlu menyemak Key selepas aplikasi dijana?",guide:"Kerana proses auto-generation tidak semestinya memilih Key yang tepat; Key mesti unik, tidak kosong, dan konsisten supaya rekod dapat dikenal pasti dan dihubungkan melalui Ref."},{q:"Apakah fungsi Preview?",guide:"Membolehkan pembangun melihat dan menguji paparan aplikasi, borang, senarai dan pengalaman pengguna (termasuk paparan telefon) semasa proses pembangunan."},{q:"Apakah fungsi Ref dalam jadual BOOKINGS?",guide:"Menghubungkan jadual BOOKINGS kepada jadual USERS (melalui UserID) dan jadual ROOMS (melalui RoomID) supaya setiap tempahan dikaitkan dengan pengguna dan bilik yang betul."},{q:"Mengapakah ujian kemasukan data perlu dilakukan?",guide:"Untuk memastikan borang berfungsi dengan baik, nilai Key/Ref dipaparkan dengan betul, dan rekod baharu berjaya disimpan serta disegerakkan ke Google Sheets."},{q:"Apakah tindakan yang perlu dilakukan apabila aplikasi gagal memaparkan data?",guide:"Semak sama ada jadual telah disambungkan, pastikan nama Sheet betul, struktur Header konsisten pada baris pertama dan pengguna mempunyai akses kepada sumber data."}]}]},{id:"4.17",title:"4.17 AKTIVITI AMALI",blocks:[{type:"subheading",text:"TAJUK: MEMBINA APLIKASI PERTAMA FBMS"},{type:"label",text:"Arahan:"},{type:"ol",items:["Buka Google AppSheet.","Log masuk menggunakan akaun Google.","Pilih Start with Existing Data.","Pilih fail FBMS_DATABASE.","Bina aplikasi baharu.","Semak empat jadual yang telah dijana.","Tetapkan Key dan Label.","Tetapkan hubungan Ref.","Uji paparan setiap jadual.","Tambah sekurang-kurangnya satu rekod baharu.","Pastikan rekod berjaya disimpan dalam sumber data.","Uji aplikasi melalui Preview."]},{type:"label",text:"HASIL YANG PERLU DIHANTAR:"},{type:"ul",items:["Aplikasi FBMS yang berjaya dijana.","Empat jadual yang disambungkan.","Konfigurasi Key dan Label.","Konfigurasi Ref.","Bukti paparan aplikasi.","Bukti kemasukan rekod baharu."]}]},{id:"4.18",title:"4.18 SENARAI SEMAK PEMBANGUNAN",blocks:[{type:"checklist",id:"mod4_checklist",intro:"Tandakan setiap perkara selepas selesai:",groups:[{title:"Senarai Semak Aplikasi Pertama FBMS",items:["Berjaya mengakses Google AppSheet.","Berjaya menghasilkan aplikasi baharu.","Berjaya menyambungkan Google Sheets.","Berjaya memaparkan jadual USERS.","Berjaya memaparkan jadual ROOMS.","Berjaya memaparkan jadual BOOKINGS.","Berjaya memaparkan jadual APPROVALS.","Berjaya menetapkan Key.","Berjaya menetapkan Label.","Berjaya menetapkan Ref.","Berjaya menguji Preview.","Berjaya memasukkan rekod baharu.","Berjaya menyemak rekod dalam Google Sheets."]}]}]},{id:"4.19",title:"4.19 RUMUSAN MODUL & RUJUKAN RASMI",blocks:[{type:"p",text:"Dalam modul ini, peserta telah mempelajari proses asas membangunkan aplikasi menggunakan Google AppSheet."},{type:"p",text:"Peserta telah diperkenalkan kepada AppSheet Editor, proses menyambungkan sumber data, konfigurasi jadual, penetapan Key dan Label serta pembinaan hubungan antara jadual menggunakan Ref."},{type:"p",text:"Peserta juga telah mempelajari cara menguji aplikasi melalui Preview dan melakukan ujian kemasukan data."},{type:"p",text:"Pengetahuan ini menjadi asas kepada pembangunan aplikasi yang lebih kompleks."},{type:"p",text:"Dalam modul seterusnya, peserta akan mempelajari dengan lebih mendalam struktur AppSheet Editor, konfigurasi Table, Column dan pelbagai tetapan penting yang mempengaruhi cara aplikasi berfungsi."},{type:"subheading",text:"RUJUKAN RASMI"},{type:"links",items:[{label:"1. Google AppSheet",url:"https://www.appsheet.com/"},{label:"2. AppSheet Help",url:"https://support.google.com/appsheet/"},{label:"3. AppSheet Data",url:"https://support.google.com/appsheet/answer/10106618"}]}]}]},ig={id:5,code:"MODUL 5",title:"Memahami AppSheet Editor dan Komponennya",shortTitle:"AppSheet Editor",subtitle:"Menguasai komponen Data, Tables, Columns (A–M), Slices, 9 jenis Views, Navigation, Format Rules dan kuiz pengukuhan.",pages:"Muka surat 45 – 63",duration:"75 minit",level:"Beginner – Intermediate",sections:[{id:"5.1",title:"5.1 Pengenalan",blocks:[{type:"p",text:"Google AppSheet Editor ialah ruang utama untuk membina, mengubah suai dan mengurus aplikasi yang dibangunkan menggunakan AppSheet."},{type:"label",text:"Melalui Editor, pembangun boleh:"},{type:"ul",items:["Menguruskan sumber data aplikasi.","Menetapkan struktur jadual dan medan.","Mengawal paparan data.","Membina borang dan paparan maklumat.","Mengawal navigasi aplikasi.","Menetapkan peraturan paparan.","Menguruskan fungsi dan interaksi pengguna."]},{type:"p",text:"Dalam modul ini, peserta akan memahami komponen utama AppSheet Editor dan bagaimana setiap komponen digunakan untuk menghasilkan aplikasi yang lebih tersusun dan mudah digunakan."},{type:"callout",variant:"note",title:"Nota",text:"Susunan menu dan nama pilihan dalam AppSheet Editor mungkin berubah mengikut kemas kini Google. Fungsi asas yang diterangkan dalam modul ini masih menjadi panduan utama."}]},{id:"5.2",title:"5.2 Objektif Pembelajaran",blocks:[{type:"p",text:"Pada akhir modul ini, peserta dapat:"},{type:"ol",items:["Mengenal pasti komponen utama AppSheet Editor.","Menguruskan jadual dan struktur data.","Mengubah suai tetapan setiap column.","Memahami konsep Slice dan kegunaannya.","Membina dan menguruskan Views.","Menetapkan navigasi aplikasi.","Menghasilkan paparan aplikasi yang lebih mesra pengguna."]}]},{id:"5.3",title:"5.3 Mengenali Komponen Utama AppSheet Editor",blocks:[{type:"p",text:"Secara umum, AppSheet Editor mempunyai beberapa bahagian utama."},{type:"subheading",text:"A. Data"},{type:"p",text:"Bahagian Data digunakan untuk menguruskan sumber data dan struktur maklumat yang digunakan oleh aplikasi."},{type:"label",text:"Antara fungsi utama:"},{type:"ul",items:["Tables – menguruskan jadual data.","Columns – menguruskan medan atau kolum.","Slices – menghasilkan paparan data berdasarkan syarat tertentu."]},{type:"table",title:"Contoh — Jadual Sistem Tempahan Bilik",headers:["Table","Kegunaan"],rows:[["USERS","Menyimpan maklumat pengguna"],["ROOMS","Menyimpan maklumat bilik"],["BOOKINGS","Menyimpan rekod tempahan"],["APPROVALS","Menyimpan rekod kelulusan"]]},{type:"subheading",text:"B. App"},{type:"p",text:"Bahagian App digunakan untuk menguruskan paparan dan pengalaman pengguna."},{type:"label",text:"Antara komponen yang berkaitan:"},{type:"ul",items:["Views – paparan maklumat dalam aplikasi.","Format Rules – peraturan untuk mengubah penampilan maklumat berdasarkan keadaan tertentu.","Navigation – susunan paparan yang boleh diakses oleh pengguna.","Branding dan tetapan paparan – mengawal identiti visual aplikasi."]},{type:"subheading",text:"C. Actions"},{type:"p",text:"Actions digunakan untuk membolehkan pengguna melaksanakan sesuatu tindakan dalam aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Menghantar permohonan.","Meluluskan tempahan.","Menolak permohonan.","Mengemaskini status.","Membuka paparan tertentu."]},{type:"subheading",text:"D. Automation"},{type:"p",text:"Automation digunakan untuk melaksanakan proses secara automatik berdasarkan sesuatu peristiwa."},{type:"label",text:"Contoh:"},{type:"ul",items:["Menghantar e-mel selepas tempahan dibuat.","Menghantar notifikasi apabila permohonan diluluskan.","Mengemaskini rekod apabila syarat tertentu dipenuhi."]},{type:"subheading",text:"E. Security"},{type:"p",text:"Bahagian Security digunakan untuk menguruskan keselamatan aplikasi."},{type:"label",text:"Contoh:"},{type:"ul",items:["Require Sign-In.","Pengesahan pengguna.","Security Filters.","Kawalan akses kepada data."]}]},{id:"5.4",title:"5.4 Menguruskan Tables",blocks:[{type:"p",text:"Tables ialah jadual yang menjadi sumber data kepada aplikasi."},{type:"p",text:"Setiap Table biasanya dihubungkan kepada satu sumber data seperti Google Sheets."},{type:"table",title:"Contoh: Jadual BOOKINGS",headers:["BookingID","UserEmail","RoomID","BookingDate","Status"],rows:[["B001","ali@gmail.com","R001","20/11/2026","Pending"],["B002","abu@gmail.com","R002","21/11/2026","Approved"]]},{type:"label",text:"Dalam AppSheet, pembangun boleh:"},{type:"ol",items:["Menambah Table baharu.","Menghubungkan sumber data.","Melihat senarai Table yang digunakan.","Membuang Table daripada aplikasi.","Menyemak struktur Table.","Mengemaskini struktur apabila kolum dalam sumber data berubah."]},{type:"callout",variant:"warning",title:"Perhatian",text:"Membuang Table daripada aplikasi tidak semestinya memadamkan data asal dalam Google Sheets. Semak sumber data sebelum melakukan sebarang perubahan."},{type:"subheading",text:"Cara menambah Table"},{type:"ol",items:["Buka AppSheet Editor.","Pergi ke bahagian Data.","Pilih Tables.","Klik pilihan untuk menambah Table.","Pilih sumber data.","Pilih jadual atau worksheet yang diperlukan.","Sahkan penambahan."]},{type:"subheading",text:"Cara mengemaskini struktur Table"},{type:"p",text:"Jika pembangun menambah kolum baharu dalam Google Sheets, AppSheet mungkin perlu membaca semula struktur tersebut."},{type:"label",text:"Langkah umum:"},{type:"ol",items:["Buka Data.","Pilih Table yang ingin dikemaskini.","Cari pilihan Regenerate Structure atau pilihan setara.","Jalankan proses tersebut.","Semak semula senarai Column."]}]},{id:"5.5",title:"5.5 Menguruskan Columns",blocks:[{type:"p",text:"Columns ialah medan yang menyimpan jenis maklumat tertentu dalam sesuatu Table."},{type:"table",title:"Contoh: Table BOOKINGS",headers:["Column","Jenis Data"],rows:[["BookingID","Text"],["UserEmail","Email"],["RoomID","Ref"],["BookingDate","Date"],["StartTime","Time"],["EndTime","Time"],["Purpose","LongText"],["Status","Enum"]]},{type:"p",text:"Setiap Column mempunyai tetapan tersendiri."},{type:"subheading",text:"A. Column Name"},{type:"p",text:"Nama sebenar medan dalam sumber data. Contoh: BookingID, UserEmail, BookingDate."},{type:"p",text:"Gunakan nama yang ringkas, konsisten dan mudah difahami."},{type:"subheading",text:"B. Type"},{type:"p",text:"Menentukan jenis data yang boleh disimpan."},{type:"table",title:"Senarai Data Type & Kegunaan",headers:["Type","Kegunaan"],rows:[["Text","Teks biasa"],["LongText","Teks yang panjang"],["Name","Nama individu"],["Email","Alamat e-mel"],["Phone","Nombor telefon"],["Number","Nombor bulat"],["Decimal","Nombor perpuluhan"],["Price","Nilai kewangan"],["Date","Tarikh"],["DateTime","Tarikh dan masa"],["Time","Masa"],["Yes/No","Pilihan Ya atau Tidak"],["Enum","Pilihan satu nilai"],["EnumList","Pilihan lebih daripada satu nilai"],["Image","Gambar"],["File","Fail"],["Signature","Tandatangan"],["Location","Lokasi"],["Ref","Rujukan kepada Table lain"]]},{type:"p",text:"Pemilihan Type yang betul penting supaya AppSheet dapat memaparkan dan memproses data dengan sesuai."},{type:"subheading",text:"C. Key"},{type:"p",text:"Key ialah nilai unik yang digunakan untuk mengenal pasti setiap rekod. Contoh: U001, R001, B001."},{type:"p",text:"Setiap rekod perlu mempunyai Key yang unik."},{type:"code",title:"Contoh tetapan untuk BookingID",code:`Type: Text
Key: ON
Initial Value: UNIQUEID()`},{type:"p",text:"Formula UNIQUEID() menghasilkan nilai unik untuk digunakan sebagai ID rekod."},{type:"subheading",text:"D. Label"},{type:"p",text:"Label ialah Column yang digunakan sebagai nama paparan bagi sesuatu rekod."},{type:"table",title:"Contohnya, Table ROOMS mempunyai:",headers:["RoomID","RoomName"],rows:[["R001","Bilik Mesyuarat A"],["R002","Makmal Komputer 1"]]},{type:"p",text:"RoomID boleh dijadikan Key, manakala RoomName dijadikan Label. Apabila pengguna memilih bilik, AppSheet boleh memaparkan nama bilik berbanding ID yang sukar difahami."},{type:"subheading",text:"E. Show?"},{type:"p",text:"Menentukan sama ada Column dipaparkan kepada pengguna."},{type:"ul",items:["BookingID boleh disembunyikan kerana dijana secara automatik.","BookingDate perlu dipaparkan.","Purpose perlu dipaparkan supaya pengguna boleh menyemak tujuan tempahan."]},{type:"subheading",text:"F. Editable?"},{type:"p",text:"Menentukan sama ada pengguna boleh mengubah nilai Column."},{type:"ul",items:["BookingID: tidak boleh diedit.","Purpose: boleh diedit.","Status: mungkin hanya boleh diubah oleh pengguna yang mempunyai kebenaran tertentu."]},{type:"subheading",text:"G. Required?"},{type:"p",text:"Menentukan sama ada sesuatu medan wajib diisi."},{type:"ul",items:["Nama pemohon: wajib.","Tarikh tempahan: wajib.","Tujuan tempahan: wajib."]},{type:"p",text:"Jika medan ditetapkan sebagai Required, pengguna perlu mengisinya sebelum rekod boleh disimpan."},{type:"subheading",text:"H. Initial Value"},{type:"p",text:"Initial Value menetapkan nilai awal apabila rekod baharu dicipta."},{type:"code",title:"Contoh Initial Value (ID Unik)",code:"UNIQUEID()"},{type:"code",title:"Untuk merekodkan e-mel pengguna yang sedang log masuk",code:"USEREMAIL()"},{type:"code",title:"Untuk mendapatkan tarikh semasa",code:"TODAY()"},{type:"subheading",text:"I. App Formula"},{type:"p",text:"App Formula digunakan untuk mengira atau menghasilkan nilai berdasarkan formula AppSheet."},{type:"code",title:"Contoh App Formula (Jumlah Harga)",code:"[Quantity] * [UnitPrice]"},{type:"p",text:"Formula tersebut mengira jumlah harga berdasarkan kuantiti dan harga seunit."},{type:"table",title:"Perbezaan Initial Value dengan App Formula:",headers:["Initial Value","App Formula"],rows:[["Menetapkan nilai awal semasa rekod dicipta","Mengira nilai menggunakan formula"],["Biasanya digunakan untuk nilai permulaan","Digunakan untuk nilai yang bergantung pada data lain"],["Nilai boleh diubah jika tetapan membenarkannya","Biasanya dikira oleh sistem dan bukan diedit secara manual"]]},{type:"label",text:"Contoh penggunaan:"},{type:"ul",items:["Initial Value: menetapkan tarikh tempahan kepada tarikh hari ini.","App Formula: mengira jumlah bayaran berdasarkan kuantiti dan harga."]},{type:"subheading",text:"J. Valid If"},{type:"p",text:"Valid If digunakan untuk menetapkan syarat bagi nilai yang boleh diterima."},{type:"code",title:"Contoh 1 (Kuantiti > 0)",code:"[Quantity] > 0"},{type:"p",text:"Pengguna hanya boleh memasukkan kuantiti yang lebih besar daripada sifar."},{type:"code",title:"Contoh 2 (Senarai Status Sah)",code:'IN([Status], {"Pending", "Approved", "Rejected"})'},{type:"p",text:"Nilai Status mestilah salah satu daripada pilihan yang ditetapkan."},{type:"subheading",text:"K. Suggested Values"},{type:"p",text:"Suggested Values memberikan cadangan nilai kepada pengguna semasa mengisi borang."},{type:"code",title:"Contoh Suggested Values",code:'{"Mesyuarat", "Latihan", "Perbincangan", "Bengkel"}'},{type:"p",text:"Pengguna boleh memilih daripada senarai cadangan tersebut."},{type:"subheading",text:"L. Editable If"},{type:"p",text:"Editable If menentukan keadaan yang membenarkan sesuatu Column diedit."},{type:"code",title:"Contoh Editable If",code:'[Status] = "Pending"'},{type:"p",text:"Maksudnya, medan tersebut hanya boleh diedit apabila status tempahan masih Pending."},{type:"subheading",text:"M. Required If"},{type:"p",text:"Required If menentukan keadaan yang menyebabkan sesuatu medan menjadi wajib diisi."},{type:"code",title:"Contoh Required If",code:'[Status] = "Rejected"'},{type:"p",text:"Contohnya, medan Catatan Penolakan boleh diwajibkan apabila permohonan ditolak."},{type:"callout",variant:"note",title:"Nota",text:"Expression di atas ialah contoh asas. Penggunaannya bergantung pada struktur Table dan nama Column sebenar dalam aplikasi."}]},{id:"5.6",title:"5.6 Memahami Slices",blocks:[{type:"p",text:"Slice ialah sebahagian daripada data asal yang dipaparkan berdasarkan syarat tertentu."},{type:"p",text:"Bayangkan kita mempunyai 1,000 rekod tempahan. Kita tidak semestinya mahu memaparkan semua rekod kepada setiap pengguna."},{type:"label",text:"Dengan Slice, kita boleh menghasilkan paparan khusus seperti:"},{type:"ul",items:["Tempahan saya.","Tempahan yang masih menunggu kelulusan.","Tempahan yang telah diluluskan.","Tempahan untuk bulan semasa."]},{type:"p",text:"Slice tidak menghasilkan salinan data baharu. Ia menyediakan satu paparan terpilih daripada Table asal."},{type:"subheading",text:"A. Contoh Slice: MyBookings"},{type:"p",text:"Tujuan: Memaparkan tempahan milik pengguna yang sedang log masuk."},{type:"label",text:"Langkah:"},{type:"ol",items:["Pergi ke Data.","Pilih Slices.","Tambah Slice baharu.","Namakan Slice sebagai MyBookings.","Pilih Source Table: BOOKINGS.","Masukkan Row Filter Condition:"]},{type:"code",title:"Row Filter Condition (MyBookings)",code:"[UserEmail] = USEREMAIL()"},{type:"label",text:"Maksud formula:"},{type:"ul",items:["[UserEmail] merujuk kepada e-mel pemohon dalam rekod.","USEREMAIL() mendapatkan e-mel pengguna yang sedang log masuk.","AppSheet hanya memaparkan rekod yang sepadan dengan e-mel tersebut."]},{type:"subheading",text:"B. Contoh Slice: PendingBookings"},{type:"p",text:"Tujuan: Memaparkan tempahan yang belum diluluskan."},{type:"code",title:"Row Filter Condition (PendingBookings)",code:'[Status] = "Pending"'},{type:"p",text:"Hanya rekod yang mempunyai Status Pending akan dip
